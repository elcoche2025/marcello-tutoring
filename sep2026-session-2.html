<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marcello's Session — September 9, 2026 (The Painted Essay 🎨)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --teal: #00897B; --teal-light: #E0F2F1; --teal-dark: #00695C;
    --blue: #4472C4; --blue-light: #D9E2F3;
    --green: #4CAF50; --green-light: #E8F5E9;
    --gold: #F5B700; --gold-light: #FFF8E1; --gold-dark: #B7791F;
    --orange: #FB8C00; --orange-light: #FFF3E0;
    --red: #E53935; --red-light: #FFEBEE;
    --purple: #9C27B0; --purple-light: #F3E5F5;
    --sky: #29B6F6; --sky-light: #E1F5FE;
    --p-red: #EF5350; --p-red-light: #FFCDD2; --p-yellow: #FDD835; --p-yellow-light: #FFF9C4; --p-blue: #42A5F5; --p-blue-light: #BBDEFB; --p-green: #66BB6A; --p-green-light: #C8E6C9;
    --bg: #F7F6FA; --card: #FFFFFF;
    --text: #2D3748; --muted: #718096;
    --radius: 16px; --shadow: 0 4px 20px rgba(0,0,0,0.08);
  }
  body { font-family: 'Nunito', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 80px; }
  header { background: linear-gradient(135deg, #6A1B9A 0%, #8E24AA 45%, #D81B60 100%); color: white; text-align: center; padding: 24px 20px 48px; position: relative; }
  header::after { content: ''; position: absolute; bottom: -2px; left: 0; right: 0; height: 36px; background: var(--bg); border-radius: 50% 50% 0 0; }
  header h1 { font-size: 1.8rem; font-weight: 800; margin-bottom: 2px; text-shadow: 0 2px 6px rgba(0,0,0,0.12); }
  header p { font-size: 0.95rem; opacity: 0.95; }
  .save-indicator { position: absolute; top: 10px; right: 16px; font-size: 0.75rem; opacity: 0.8; transition: opacity 0.3s; }
  .save-indicator.flash { opacity: 1; }
  .tutor-reset { position: absolute; top: 10px; left: 16px; font-size: 0.7rem; padding: 4px 10px; border-radius: 12px; background: rgba(255,255,255,0.18); border: 1px solid rgba(255,255,255,0.35); color: white; cursor: pointer; font-family: 'Nunito', sans-serif; font-weight: 700; opacity: 0.6; }
  .tutor-reset:hover { opacity: 1; }

  .main-tabs { display: flex; justify-content: center; gap: 6px; padding: 10px 8px 0; max-width: 860px; margin: 0 auto; flex-wrap: wrap; position: relative; z-index: 2; }
  .main-tab { padding: 10px 13px; border-radius: 12px; font-weight: 700; font-size: 0.8rem; cursor: pointer; transition: all 0.25s; border: 2px solid #D0D5DD; background: white; color: var(--muted); font-family: 'Nunito', sans-serif; white-space: nowrap; }
  .main-tab:hover { border-color: var(--purple); color: var(--purple); }
  .main-tab.active { background: var(--purple); border-color: var(--purple); color: white; box-shadow: 0 3px 12px rgba(156,39,176,0.35); transform: translateY(-2px); }
  .main-tab.done { border-color: var(--green); color: var(--green); }
  .main-tab.active.done { background: var(--green); border-color: var(--green); color: white; }

  .container { max-width: 760px; margin: 16px auto; padding: 0 16px; }
  .container.wide { max-width: 1000px; }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }
  .card { background: white; border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px; margin-bottom: 16px; animation: fadeUp 0.35s ease; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  .card h2 { font-size: 1.25rem; font-weight: 800; margin-bottom: 6px; }
  .card .directions { font-size: 0.92rem; color: var(--muted); margin-bottom: 14px; line-height: 1.5; }
  .review-banner { display: flex; align-items: center; gap: 8px; background: var(--green-light); border: 2px solid var(--green); border-radius: 12px; padding: 10px 14px; margin-bottom: 14px; font-size: 0.88rem; color: #2E7D32; font-weight: 700; }
  .info-box { background: var(--sky-light); border-left: 4px solid var(--sky); border-radius: 0 10px 10px 0; padding: 12px 16px; margin-bottom: 14px; font-weight: 600; line-height: 1.5; font-size: 0.92rem; color: #01579B; }

  .btn { padding: 12px 24px; border-radius: 12px; font-weight: 700; font-size: 0.95rem; cursor: pointer; border: none; font-family: 'Nunito', sans-serif; transition: all 0.2s; }
  .btn:hover { transform: translateY(-1px); filter: brightness(1.05); }
  .btn-primary { background: var(--teal); color: white; }
  .btn-success { background: var(--green); color: white; }
  .btn-orange { background: var(--orange); color: white; }
  .btn-purple { background: var(--purple); color: white; }
  .btn-blue { background: var(--blue); color: white; }
  .btn-gold { background: var(--gold); color: #5D4037; }
  .btn-secondary { background: #E0E0E0; color: var(--text); }
  .btn-sm { padding: 8px 14px; font-size: 0.85rem; border-radius: 10px; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .btn-row { display: flex; gap: 10px; justify-content: center; margin-top: 16px; flex-wrap: wrap; }
  .gate-note { text-align: center; font-size: 0.83rem; color: var(--muted); font-style: italic; margin-top: 6px; }

  /* Reading */
  .word-card { background: white; border: 2px solid #E0E0E0; border-radius: 14px; padding: 16px 18px; margin-bottom: 12px; text-align: center; transition: all 0.25s; }
  .word-card.done { border-color: var(--green); background: #FAFFFB; }
  .word-big { font-size: 2.1rem; font-weight: 800; letter-spacing: 1px; margin-bottom: 4px; }
  .word-big .tricky { color: var(--red); background: var(--gold-light); border-radius: 6px; padding: 0 4px; }
  .word-syll { font-size: 0.95rem; color: var(--muted); font-weight: 700; letter-spacing: 2px; margin-bottom: 10px; }
  .word-tip { font-size: 0.84rem; color: var(--gold-dark); font-weight: 700; margin-bottom: 10px; min-height: 20px; }
  .word-btns { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .prosody-box { background: var(--sky-light); border: 2px solid var(--sky); border-radius: 14px; padding: 18px; margin-bottom: 12px; }
  .prosody-text { font-size: 1.12rem; line-height: 1.9; font-weight: 600; margin-bottom: 12px; }
  .score-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
  .score-row label { font-size: 0.82rem; font-weight: 700; color: var(--muted); }
  .score-input { width: 70px; padding: 8px 10px; border: 2px solid #D0D5DD; border-radius: 10px; font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 0.95rem; text-align: center; }
  .tutor-tag { font-size: 0.68rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); background: #ECEFF1; border-radius: 8px; padding: 2px 8px; }
  .timer-btn { font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 0.85rem; padding: 7px 12px; border-radius: 10px; border: 2px solid var(--blue); background: white; color: var(--blue); cursor: pointer; min-width: 92px; }
  .timer-btn.running { background: var(--blue); color: white; }
  .timer-btn.finished { background: var(--green); border-color: var(--green); color: white; }

  /* Fix-It */
  .fix-card { background: white; border: 2px solid #E0E0E0; border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; transition: all 0.25s; }
  .fix-card.correct { border-color: var(--green); background: #FAFFFB; }
  .fix-sentence { font-size: 1.12rem; font-weight: 700; line-height: 1.6; margin-bottom: 10px; }
  .fix-sentence .blank { display: inline-block; min-width: 90px; border-bottom: 3px solid var(--orange); text-align: center; color: var(--orange); font-weight: 800; padding: 0 6px; }
  .fix-sentence .blank.filled { color: #2E7D32; border-color: var(--green); }
  .opts { display: flex; gap: 8px; flex-wrap: wrap; }
  .opt { padding: 9px 18px; border-radius: 20px; font-size: 1rem; font-weight: 800; border: 2px solid #CE93D8; background: white; color: var(--purple); cursor: pointer; font-family: 'Nunito', sans-serif; transition: all 0.2s; }
  .opt:hover { border-color: var(--purple); transform: translateY(-1px); }
  .opt.right { background: var(--green); border-color: var(--green); color: white; }
  .opt.wrong { background: var(--red-light); border-color: var(--red); color: var(--red); text-decoration: line-through; }
  .feedback { margin-top: 10px; font-size: 0.88rem; font-weight: 700; line-height: 1.45; border-radius: 10px; padding: 9px 12px; }
  .feedback.ok { background: var(--green-light); color: #2E7D32; }
  .feedback.hint { background: var(--gold-light); color: #7B6400; }
  .squish { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; margin: 8px 0 10px; }
  .sq-letter { width: 40px; height: 46px; border-radius: 10px; border: 2px solid #90CAF9; background: white; color: #1565C0; font-size: 1.4rem; font-weight: 800; display: flex; align-items: center; justify-content: center; cursor: pointer; font-family: 'Nunito', sans-serif; transition: all 0.25s; }
  .sq-letter.space { border: none; width: 18px; cursor: default; }
  .sq-letter.gone { opacity: 0.25; transform: translateY(18px) rotate(15deg); text-decoration: line-through; cursor: default; }
  .sq-letter.wrong { background: var(--red-light); border-color: var(--red); color: var(--red); }
  .sq-letter.keep { border-color: var(--green); color: #2E7D32; cursor: default; }
  .sq-apos { width: 22px; height: 46px; display: flex; align-items: flex-start; justify-content: center; font-size: 1.8rem; font-weight: 800; color: var(--red); animation: fadeUp 0.4s ease; }
  .sq-result { font-size: 1.3rem; font-weight: 800; color: #2E7D32; margin-left: 10px; }

  /* Painted Essay */
  .legend { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .legend span { font-size: 0.8rem; font-weight: 800; padding: 5px 12px; border-radius: 14px; }
  .lg-red { background: var(--p-red-light); color: #B71C1C; } .lg-yellow { background: var(--p-yellow-light); color: #7B6400; } .lg-blue { background: var(--p-blue-light); color: #0D47A1; } .lg-green { background: var(--p-green-light); color: #1B5E20; }
  .para { border: 2px solid #E0E0E0; border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; line-height: 1.75; font-size: 1rem; font-weight: 600; transition: all 0.25s; background: white; }
  .para.c-red { background: var(--p-red-light); border-color: var(--p-red); } .para.c-yellow { background: var(--p-yellow-light); border-color: var(--p-yellow); } .para.c-blue { background: var(--p-blue-light); border-color: var(--p-blue); } .para.c-green { background: var(--p-green-light); border-color: var(--p-green); }
  .para .p-num { font-size: 0.72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); display: block; margin-bottom: 4px; }
  .para .sent { cursor: pointer; border-radius: 6px; padding: 1px 3px; transition: all 0.2s; }
  .para .sent:hover { background: rgba(0,0,0,0.06); }
  .para .sent.focus-hit { background: #fff; outline: 3px solid var(--purple); font-weight: 800; }
  .para .sent.focus-miss { outline: 2px dashed var(--red); }
  .color-row { display: flex; gap: 6px; margin-top: 8px; align-items: center; flex-wrap: wrap; }
  .color-row .lbl { font-size: 0.78rem; font-weight: 800; color: var(--muted); margin-right: 4px; }
  .cbtn { width: 34px; height: 34px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 2px #D0D5DD; cursor: pointer; }
  .cbtn.red { background: var(--p-red); } .cbtn.yellow { background: var(--p-yellow); } .cbtn.blue { background: var(--p-blue); } .cbtn.green { background: var(--p-green); }
  .cbtn.picked { box-shadow: 0 0 0 3px #263238; }
  .job { font-size: 0.82rem; font-weight: 700; margin-top: 8px; padding: 6px 10px; border-radius: 8px; background: rgba(255,255,255,0.7); color: var(--text); }

  /* Plan */
  .q-card { background: white; border: 2px solid #E0E0E0; border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; transition: all 0.25s; }
  .q-card.done { border-color: var(--green); background: #FAFFFB; }
  .q-title { font-weight: 800; font-size: 1rem; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
  .q-title .q-num { background: var(--purple); color: white; border-radius: 50%; width: 26px; height: 26px; display: inline-flex; align-items: center; justify-content: center; font-size: 0.8rem; flex-shrink: 0; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .chip { padding: 8px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: 700; background: white; border: 2px solid #B2DFDB; color: var(--teal-dark); cursor: pointer; font-family: 'Nunito', sans-serif; transition: all 0.2s; }
  .chip.active { background: var(--teal); color: white; border-color: var(--teal); }
  .chip.used { opacity: 0.35; text-decoration: line-through; cursor: not-allowed; }
  .text-input-wrap { position: relative; }
  .text-input { width: 100%; padding: 10px 44px 10px 12px; border: 2px solid #D0D5DD; border-radius: 10px; font-family: 'Nunito', sans-serif; font-size: 0.95rem; font-weight: 600; background: #FAFBFC; }
  .text-input:focus { border-color: var(--purple); outline: none; background: white; }
  .mini-mic { position: absolute; top: 6px; right: 6px; width: 32px; height: 32px; border-radius: 50%; background: var(--orange-light); border: 2px solid var(--orange); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 0.9rem; }
  .mini-mic.recording { background: var(--red); border-color: var(--red); color: white; animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(229,57,53,0.5); } 50% { box-shadow: 0 0 0 8px rgba(229,57,53,0); } }
  .focus-preview { background: var(--p-red-light); border: 2px dashed var(--p-red); border-radius: 12px; padding: 12px 14px; font-size: 1.05rem; font-weight: 700; line-height: 1.5; margin-top: 8px; }
  .focus-preview .slot { color: #B71C1C; }

  /* Write */
  .gist-anchor { background: var(--p-red-light); border: 2px solid var(--p-red); border-radius: 10px; padding: 8px 14px; margin: 0 auto 12px; text-align: center; font-weight: 800; font-size: 0.92rem; color: #B71C1C; }
  .plan-side { background: #FAFBFC; border: 2px dashed #B0BEC5; border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; font-size: 0.88rem; line-height: 1.5; }
  .plan-side b { color: var(--purple); }
  .write-card { background: white; border: 2px solid #E0E0E0; border-radius: 16px; padding: 18px 20px; margin-bottom: 16px; transition: all 0.25s; }
  .write-card.p-red { border-color: var(--p-red); } .write-card.p-yellow { border-color: var(--p-yellow); }
  .write-card.locked { background: var(--green-light); border-color: var(--green); }
  .write-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; flex-wrap: wrap; gap: 8px; }
  .write-card-title { font-size: 1.05rem; font-weight: 800; }
  .write-badge { font-size: 0.72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; padding: 3px 10px; border-radius: 12px; }
  .prompt-line { font-size: 0.95rem; font-weight: 700; margin-bottom: 8px; line-height: 1.5; }
  .territory { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .territory span { font-size: 0.76rem; font-weight: 700; padding: 4px 10px; border-radius: 10px; }
  .territory .must { background: var(--green-light); color: #2E7D32; } .territory .not { background: var(--red-light); color: #B71C1C; }
  .starter-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .starter { padding: 6px 12px; border-radius: 16px; font-size: 0.84rem; font-weight: 700; border: 2px solid #CE93D8; background: white; color: var(--purple); cursor: pointer; font-family: 'Nunito', sans-serif; }
  .starter.glue { border-color: #90CAF9; color: #1565C0; }
  .verb-bank { background: var(--gold-light); border: 2px solid var(--gold); border-radius: 12px; padding: 10px 14px; margin-bottom: 14px; }
  .verb-bank .vb-title { font-size: 0.8rem; font-weight: 800; color: var(--gold-dark); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
  .verb-bank .vb-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .verb-bank .vb { font-size: 0.85rem; font-weight: 700; background: white; border: 1px solid #E0C97A; border-radius: 10px; padding: 4px 10px; color: #5D4037; }
  .verb-bank .vb b { color: #2E7D32; }
  .write-textarea-wrap { position: relative; }
  .write-textarea { width: 100%; min-height: 80px; border: 2px solid #D0D5DD; border-radius: 12px; padding: 14px; font-family: 'Nunito', sans-serif; font-size: 1rem; font-weight: 600; resize: vertical; line-height: 1.6; background: #FAFBFC; }
  .write-textarea:focus { border-color: var(--purple); outline: none; background: white; }
  .write-textarea.locked { background: white; border-color: var(--green); }
  .type-tag { position: absolute; top: -10px; right: 12px; font-size: 0.68rem; font-weight: 800; background: var(--purple); color: white; border-radius: 10px; padding: 2px 9px; text-transform: uppercase; letter-spacing: 0.5px; }

  .check-box2 { border-radius: 12px; padding: 12px 14px; margin-top: 12px; border: 2px solid; }
  .cb-sent { background: #FFFDE7; border-color: var(--gold); }
  .cb-sent.matched { background: var(--green-light); border-color: var(--green); }
  .cb-sent.unmatched { background: var(--red-light); border-color: var(--red); }
  .source-check-prompt { font-size: 0.92rem; line-height: 1.5; font-weight: 600; margin-bottom: 10px; color: #5D4037; }
  .source-check-row { display: flex; gap: 8px; }
  .source-btn { flex: 1; padding: 10px; border-radius: 10px; font-weight: 700; font-size: 0.85rem; border: 2px solid; cursor: pointer; font-family: 'Nunito', sans-serif; }
  .source-btn.match { background: white; color: var(--green); border-color: var(--green); } .source-btn.match.active { background: var(--green); color: white; }
  .source-btn.unmatch { background: white; color: var(--red); border-color: var(--red); } .source-btn.unmatch.active { background: var(--red); color: white; }

  .proof-box { background: var(--purple-light); border: 2px solid var(--purple); border-radius: 12px; padding: 14px 16px; margin-top: 12px; }
  .proof-box.done { background: var(--green-light); border-color: var(--green); }
  .proof-title { font-size: 0.92rem; font-weight: 800; color: var(--purple); margin-bottom: 4px; } .proof-box.done .proof-title { color: var(--green); }
  .proof-sub { font-size: 0.82rem; color: #6A1B9A; margin-bottom: 12px; line-height: 1.4; } .proof-box.done .proof-sub { color: #2E7D32; }
  .proof-words { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .proof-word { padding: 8px 12px; border-radius: 10px; font-size: 1.05rem; font-weight: 700; border: 2px solid #D1C4E9; background: white; color: #B0A8C0; cursor: default; font-family: 'Nunito', sans-serif; transition: all 0.18s; }
  .proof-word.next { color: var(--purple); border-color: var(--purple); cursor: pointer; animation: pulseP 1.3s infinite; }
  @keyframes pulseP { 0%,100% { box-shadow: 0 0 0 0 rgba(156,39,176,0.4); } 50% { box-shadow: 0 0 0 7px rgba(156,39,176,0); } }
  .proof-word.read { color: #2E7D32; border-color: var(--green); background: var(--green-light); }
  .proof-word.read::after { content: ' ✓'; font-size: 0.8rem; }
  .proof-progress { font-size: 0.8rem; color: var(--muted); font-weight: 700; margin-top: 10px; }

  .homo-box { background: #E3F2FD; border: 2px solid #1E88E5; border-radius: 12px; padding: 14px 16px; margin-top: 12px; }
  .homo-box.done { background: var(--green-light); border-color: var(--green); }
  .homo-box.fix { background: var(--gold-light); border-color: var(--gold); }
  .homo-title { font-size: 0.92rem; font-weight: 800; color: #1565C0; margin-bottom: 4px; } .homo-box.done .homo-title { color: var(--green); } .homo-box.fix .homo-title { color: var(--gold-dark); }
  .homo-sub { font-size: 0.82rem; color: #0D47A1; margin-bottom: 10px; line-height: 1.4; } .homo-box.done .homo-sub { color: #2E7D32; }
  .homo-item { background: white; border: 2px solid #BBDEFB; border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
  .homo-item.ok { border-color: var(--green); } .homo-item.fix { border-color: var(--gold); }
  .homo-q { font-size: 0.92rem; font-weight: 700; margin-bottom: 8px; }
  .homo-q .hw { background: var(--gold-light); border: 2px solid var(--gold); border-radius: 8px; padding: 1px 8px; font-weight: 800; }
  .homo-opts { display: flex; gap: 6px; flex-wrap: wrap; }
  .homo-opt { padding: 7px 12px; border-radius: 16px; font-size: 0.84rem; font-weight: 700; border: 2px solid #90CAF9; background: white; color: #1565C0; cursor: pointer; font-family: 'Nunito', sans-serif; }
  .homo-opt.active.ok { background: var(--green); border-color: var(--green); color: white; }
  .homo-opt.active.fix { background: var(--gold); border-color: var(--gold); color: #5D4037; }
  .homo-verdict { margin-top: 8px; font-size: 0.84rem; font-weight: 700; line-height: 1.4; }
  .homo-verdict.ok { color: #2E7D32; } .homo-verdict.fix { color: #7B6400; }

    hook: { title: '🔴 Sentence 1 — the hook', badge: 'lg-red', prompt: 'Start the essay with a sentence that makes the reader lean in. Pick one, or write your own.', must: 'MUST: a general idea about great hearts', not: 'NOT YET: your person’s name' },
    focus: { title: '🔴 Sentence 2 — the FOCUS STATEMENT', badge: 'lg-red', prompt: 'The boss sentence. Type it from your plan (it is pinned above): who + “has a great heart because” + reason 1 + “and because” + reason 2.', must: 'MUST: the person + BOTH reasons', not: 'NOT YET: examples' },
    topic: { title: '🟡 Sentence 3 — proof 1 topic sentence', badge: 'lg-yellow', prompt: 'Start the yellow paragraph: say reason 1 again, on its own. “First, …” or “One way … shows a great heart is …”', must: 'MUST: reason 1 only', not: 'NOT: reason 2 (that’s the blue paragraph)' },
    example: { title: '🟡 Sentence 4 — the evidence', badge: 'lg-yellow', prompt: 'Prove it with a REAL time it happened. Past tense — watch the rule-breaker verbs!', must: 'MUST: one real example (when / what happened)', not: 'NOT: how you felt about it (save it)' }
  }[sent.role];
  let html = '<div class="write-card p-' + sent.part + ' ' + (L ? 'locked' : '') + '"><div class="write-card-header"><div class="write-card-title">' + (L ? '✓ ' : '') + meta.title + '</div><span class="write-badge ' + meta.badge + '">' + (sent.part === 'red' ? 'Introduction' : 'Proof 1') + '</span></div>' +
    '<div class="prompt-line">' + esc(meta.prompt) + '</div><div class="territory"><span class="must">' + esc(meta.must) + '</span><span class="not">' + esc(meta.not) + '</span></div>';
  if (!L) {
    if (sent.role === 'hook') { html += '<div class="starter-row">'; HOOKS.forEach(function(h) { html += '<button class="starter" onclick="setSentence(' + i + ',' + attr(h) + ')">' + esc(h) + '</button>'; }); html += '</div>'; }
    if (sent.role === 'topic') { html += '<div class="starter-row">'; TOPIC_STARTERS.forEach(function(h) { html += '<button class="starter" onclick="insertWord(' + i + ',' + attr(h) + ')">' + esc(h) + '</button>'; }); html += '</div>'; }
    if (sent.role === 'example') { html += '<div class="starter-row">'; EXAMPLE_STARTERS.forEach(function(h) { html += '<button class="starter" onclick="insertWord(' + i + ',' + attr(h) + ')">' + esc(h) + '</button>'; }); GLUE.forEach(function(g) { html += '<button class="starter glue" onclick="insertWord(' + i + ',' + attr(g) + ')">' + esc(g) + '</button>'; }); html += '</div>'; }
  }
  html += '<div class="write-textarea-wrap"><span class="type-tag">⌨️ Type it</span><textarea class="write-textarea ' + (L ? 'locked' : '') + '" id="w-text-' + i + '" placeholder="Say it out loud first — then type it here" oninput="onWriteText(' + i + ')" ' + (L ? 'readonly' : '') + '>' + esc(text) + '</textarea></div>';
  if (text.trim() && !L) {
    const cls = sent.sourceCheck === 'match' ? 'matched' : (sent.sourceCheck === 'unmatch' ? 'unmatched' : '');
    const q = { hook: '🔍 <strong>Check.</strong> Is it a complete sentence (who + does what)? Does it make a reader curious?', focus: '🔍 <strong>Check.</strong> Does it name the person AND give BOTH reasons? Read it against the pinned focus statement.', topic: '🔍 <strong>Check.</strong> Is reason 1 in it — and ONLY reason 1?', example: '🔍 <strong>Check.</strong> Is it a real time it happened? Is it in the past? Is it a complete sentence?' }[sent.role];
    html += '<div class="check-box2 cb-sent ' + cls + '"><div class="source-check-prompt">' + q + '</div><div class="source-check-row"><button class="source-btn match ' + (sent.sourceCheck === 'match' ? 'active' : '') + '" onclick="setSourceCheck(' + i + ',\'match\')">✓ Yes — it works</button><button class="source-btn unmatch ' + (sent.sourceCheck === 'unmatch' ? 'active' : '') + '" onclick="setSourceCheck(' + i + ',\'unmatch\')">✗ Not yet</button></div></div>';

  if (text.trim() && !L && sent.sourceCheck === 'match' && sent.proofed) { html += buildVerbRadar(i, sent); html += buildHomoCheck(i, sent); }
  if (!L) { const can = text.trim() && sent.sourceCheck === 'match' && sent.proofed && verbPass(sent) && homoPass(sent); html += '<div class="lock-row"><button class="lock-btn" onclick="lockSentence(' + i + ')" ' + (can ? '' : 'disabled') + '>🔒 Lock sentence ' + (i+1) + '</button></div>'; }

}
function resetChecks(sent) { if (sent.sourceCheck === 'match') sent.sourceCheck = null; sent.proofed = false; sent.proofIdx = 0; sent.homo = {}; sent.verbOK = false; }
function setSentence(i, t) { const s = S.write.sentences[i]; if (s.locked) return; s.text = t; resetChecks(s); renderWrite(); debounceSave(); }
function insertWord(i, word) { const s = S.write.sentences[i]; if (s.locked) return; const cur = s.text || ''; s.text = cur + (cur && !/\s$/.test(cur) ? ' ' : '') + word + ' '; resetChecks(s); renderWrite(); const ta = document.getElementById('w-text-' + i); if (ta) { ta.focus(); try { ta.setSelectionRange(ta.value.length, ta.value.length); } catch(e) {} } debounceSave(); }
function onWriteText(i) {
  const ta = document.getElementById('w-text-' + i); if (!ta) return; const s = S.write.sentences[i];
  const prevHad = !!(s.text && s.text.trim()); const prevMatch = s.sourceCheck === 'match'; const prevProofed = s.proofed;
  s.text = ta.value; const nowHas = !!ta.value.trim(); resetChecks(s);
  if ((prevHad !== nowHas) || prevMatch || prevProofed) { const focused = document.activeElement === ta; const a = focused ? ta.selectionStart : null, b = focused ? ta.selectionEnd : null; renderWrite(); if (focused) { const t2 = document.getElementById('w-text-' + i); if (t2) { t2.focus(); try { t2.setSelectionRange(a, b); } catch(e) {} } } }
  debounceSave();
}
function setSourceCheck(i, c) { const s = S.write.sentences[i]; if (s.locked) return; s.sourceCheck = c; if (c === 'unmatch') toast('Look at the MUST label — what is missing?', 'warning'); if (c === 'match') { s.proofIdx = 0; s.proofed = false; s.homo = {}; s.verbOK = false; } renderWrite(); debounceSave(); }
// finger-point (standing)
function proofWords(sent) { return (sent.text || '').trim().split(/\s+/).filter(Boolean); }
function buildProofread(i, sent) {
  const words = proofWords(sent), idx = sent.proofIdx || 0, done = sent.proofed;
  let html = '<div class="proof-box ' + (done ? 'done' : '') + '"><div class="proof-title">' + (done ? '✓ You read every word!' : '👆 Check it word by word') + '</div><div class="proof-sub">' + (done ? 'You read the REAL word on the page each time.' : 'Touch the glowing word and read ONLY that word — what is REALLY there, not what you meant.') + '</div><div class="proof-words">';
  words.forEach(function(w, wi) { let cls = 'proof-word'; if (wi < idx) cls += ' read'; else if (wi === idx && !done) cls += ' next'; html += '<span class="' + cls + '" ' + (wi === idx && !done ? 'onclick="proofTap(' + i + ')"' : '') + '>' + esc(w) + '</span>'; });
  html += '</div>'; if (!done) html += '<div class="proof-progress">' + idx + ' of ' + words.length + ' words read</div><div class="btn-row" style="justify-content:flex-start;margin-top:10px;"><button class="btn btn-sm btn-secondary" onclick="proofReset(' + i + ')">↻ Start over</button></div>';
  return html + '</div>';
}
function proofTap(i) { const s = S.write.sentences[i]; const words = proofWords(s); const w = words[s.proofIdx]; if (w) speakText(w.replace(/[.,!?"“”]/g, ''), 0.6); s.proofIdx = (s.proofIdx || 0) + 1; if (s.proofIdx >= words.length) { s.proofed = true; toast('You read every word! 👀✓'); postToSheets('Activity Log', [SESSION_DATE, 'Marcello', 'Finger-point proofread (typed sentence ' + (i+1) + ')', 'Writing - Self-Monitoring', words.length, words.length, '100%', s.text.slice(0, 120)]); } renderWrite(); debounceSave(); }
function proofReset(i) { S.write.sentences[i].proofIdx = 0; S.write.sentences[i].proofed = false; renderWrite(); debounceSave(); }
// NEW — past-tense radar
function normWord(w) { return (w || '').toLowerCase().replace(/[’‘]/g, "'").replace(/[^a-z']/g, ''); }

function buildVerbRadar(i, sent) {
  const hits = verbHits(sent);
  if (!hits.length) return '<div class="verb-box done"><div class="verb-title">✓ Rule-breaker verb check</div><div class="verb-sub">No -ed on a rule-breaker verb. Nice.</div></div>';
  return '<div class="verb-box"><div class="verb-title">🔧 Rule-breaker verb alert</div><div class="verb-sub">Say it: “Yesterday I ___.” Then fix it in the box: ' + hits.map(function(h) { return '<span class="verb-hit">' + esc(h) + ' → ' + esc(BAD_VERBS[h]) + '</span>'; }).join('') + '</div></div>';
}
// sound-alike check (standing since Sep 2)
function homoHits(sent) { const words = proofWords(sent), hits = []; words.forEach(function(w, wi) { const n = normWord(w); HOMO_SETS.forEach(function(set) { if (set.indexOf(n) !== -1) hits.push({ idx: wi, written: n, set: set }); }); }); return hits; }

  let html = '<div class="homo-box ' + (allOk ? 'done' : (anyFix ? 'fix' : '')) + '"><div class="homo-title">' + (allOk ? '✓ Sound-alike check passed' : '🔍 Sound-alike check') + '</div><div class="homo-sub">' + (allOk ? 'Every sound-alike word means what you wanted.' : 'Your ear can’t tell these apart — look at the word and ask: which one did I MEAN?') + '</div>';
  hits.forEach(function(h) {
    const picked = homo[h.idx], status = picked ? (picked === h.written ? 'ok' : 'fix') : '';
    html += '<div class="homo-item ' + status + '"><div class="homo-q">You wrote <span class="hw">' + esc(h.written) + '</span>. Which one did you MEAN?</div><div class="homo-opts">';
    h.set.forEach(function(w) { html += '<button class="homo-opt' + (picked === w ? ' active ' + (w === h.written ? 'ok' : 'fix') : '') + '" onclick="pickHomo(' + i + ',' + h.idx + ',' + attr(w) + ')">' + esc(MEANINGS[w] || w) + '</button>'; });
    html += '</div>';
    if (status === 'ok') html += '<div class="homo-verdict ok">✓ Match.</div>'; else if (status === 'fix') html += '<div class="homo-verdict fix">🔁 Then the word you need is <strong>' + esc(picked) + '</strong>. Fix it in the box.</div>';

function pickHomo(i, wi, w) { const s = S.write.sentences[i]; if (s.locked) return; if (!s.homo) s.homo = {}; s.homo[wi] = w; const hit = homoHits(s).filter(function(h) { return h.idx === wi; })[0]; if (hit) { const ok = w === hit.written; postToSheets('Activity Log', [SESSION_DATE, 'Marcello', 'Sound-alike check (typed sentence ' + (i+1) + ')', 'Language - Confused Words', ok ? 1 : 0, 1, ok ? '100%' : '0%', 'Wrote "' + hit.written + '", meant "' + w + '"']); toast(ok ? 'Match ✓' : 'Good catch — fix it 🔁', ok ? '' : 'warning'); } renderWrite(); debounceSave(); }
function lockSentence(i) {
  const s = S.write.sentences[i]; if (!s.text.trim() || s.sourceCheck !== 'match' || !s.proofed || !verbPass(s) || !homoPass(s)) return;
  s.locked = true; S.timestamps['s' + (i+1) + 'Locked'] = new Date().toISOString();
  postToSheets('Activity Log', [SESSION_DATE, 'Marcello', 'Essay sentence ' + (i+1) + ' locked (' + s.role + ', TYPED)', 'Writing', 'Locked', '', '', s.text.slice(0, 160)]);
  toast('Sentence ' + (i+1) + ' locked! 🎉'); fireCelebration(); renderWrite(); debounceSave();
}
function unlockSentence(i) { S.write.sentences[i].locked = false; renderWrite(); debounceSave(); }
function finishWrite() { S.write.done = true; S.timestamps.writeEnd = new Date().toISOString(); postToSheets('Activity Log', [SESSION_DATE, 'Marcello', 'Essay day 1 complete (red + yellow)', 'Writing', 'Done', '', '', 'Locked: ' + S.write.sentences.filter(function(s) { return s.locked; }).length + '/4 | Who: ' + planWho()]); toast('Two paragraphs! 🎨'); fireCelebration(); saveImmediate(); updateTabBadges(); switchTab('wrap'); }

// ============================================================
//  TAB 6 — WRAP-UP
// ============================================================
function renderWrap() {
  const el = document.getElementById('card-wrap'); const w = S.wrap;
  const hasWish = w.wish.length > 0 || (w.wishCustom || '').trim();
  let html = '<div class="card">' + (w.done ? '<div class="review-banner">✅ Session complete!</div>' : '') + '<h2>⭐ Stars &amp; a Wish</h2><p class="directions">Tap a star for everything you did today. Then ONE wish for next time.</p><div class="stars-row">';
  STARS.forEach(function(l, i) { const on = w.stars.indexOf(i) !== -1; html += '<button class="star-btn ' + (on ? 'active' : '') + '" onclick="toggleStar(' + i + ')">' + (on ? '⭐ ' : '☆ ') + esc(l) + '</button>'; });
  html += '</div></div><div class="card"><h2>🌠 My wish</h2><div class="stars-row">';
  WISHES.forEach(function(g) { const on = w.wish.indexOf(g) !== -1; html += '<button class="wish-chip ' + (on ? 'active' : '') + '" onclick="toggleWish(' + attr(g) + ')">' + (on ? '✓ ' : '') + esc(g) + '</button>'; });
  html += '</div><input class="text-input" style="margin-top:10px;" id="wishCustom" placeholder="…or write your own" value="' + esc(w.wishCustom) + '" oninput="onWishCustom()"></div>';
  html += '<div class="card"><h2><span class="tutor-tag">Tutor</span> Notes</h2><div class="tutor-notes"><label>Anything to capture (energy, what he said unprompted, what to change next week, newsletter news from the parents)</label><textarea id="tn-notes" oninput="onTutorNote()">' + esc(w.tutor.notes) + '</textarea></div></div>';
  html += '<div class="card"><div class="pep-banner"><div style="font-size:2.4rem;margin-bottom:6px;">🎨❤️</div><h3>Two paragraphs down, two to go!</h3><p>You painted an essay, planned your own, and TYPED your own sentences. Next time: the blue paragraph and the green one — and then you will have written a whole 4th-grade essay.</p></div>' +
    '<div class="btn-row"><button class="btn btn-purple" onclick="finishWrap()" ' + (hasWish && w.stars.length ? '' : 'disabled') + '>' + (w.done ? '✓ All done!' : 'Finish 🎉') + '</button></div>' + (hasWish && w.stars.length ? '' : '<p class="gate-note">Tap at least one star and pick a wish.</p>') + '</div>';
  el.innerHTML = html;
}
function toggleStar(i) { const k = S.wrap.stars.indexOf(i); if (k !== -1) S.wrap.stars.splice(k, 1); else S.wrap.stars.push(i); renderWrap(); debounceSave(); }
function toggleWish(g) { const k = S.wrap.wish.indexOf(g); if (k !== -1) S.wrap.wish.splice(k, 1); else S.wrap.wish.push(g); renderWrap(); debounceSave(); }
function onWishCustom() { const el = document.getElementById('wishCustom'); if (!el) return; S.wrap.wishCustom = el.value; const btn = document.querySelector('#card-wrap .btn-purple'); if (btn) btn.disabled = !((S.wrap.wish.length || S.wrap.wishCustom.trim()) && S.wrap.stars.length); debounceSave(); }
function onTutorNote() { const el = document.getElementById('tn-notes'); if (el) { S.wrap.tutor.notes = el.value; debounceSave(); } }
function finishWrap() { S.wrap.done = true; S.timestamps.sessionEnd = new Date().toISOString(); postToSheets('Activity Log', [SESSION_DATE, 'Marcello', 'Session Complete — Painted Essay day 1', 'Wrap-up', 'Done', '', '', 'Stars: ' + S.wrap.stars.length + ' | Wish: ' + S.wrap.wish.concat(S.wrap.wishCustom.trim() ? [S.wrap.wishCustom.trim()] : []).join('; ')]); toast('Great work! 🎉'); fireCelebration(); setTimeout(fireCelebration, 600); saveImmediate(); updateTabBadges(); renderWrap(); }

// ============================================================
//  INIT
// ============================================================
let lastCloudJSON = null;
async function init() {
  const cloudState = await loadStateFromCloud(CLOUD_STATE_KEY);
  if (cloudState && cloudState.timestamps) { S = Object.assign(freshState(), cloudState); lastCloudJSON = JSON.stringify(cloudState); backfill(); toast('Loaded from cloud ☁️'); }
  else if (!VIEW_ONLY && loadFromLocalStorage()) { backfill(); toast('Loaded local save'); }
  if (S.wrap.done || S.write.done) switchTab('wrap');
  else if (S.plan.done) switchTab('write');
  else if (S.paint.done) switchTab('plan');
  else if (S.fixit.done) switchTab('paint');
  else if (S.reading.done) switchTab('fixit');
  else { renderReading(); updateTabBadges(); }
  if (VIEW_ONLY) { document.getElementById('saveIndicator').textContent = '👀 View-only mirror — syncing from cloud'; const rb = document.querySelector('.tutor-reset'); if (rb) rb.style.display = 'none'; setInterval(pollCloud, 10000); }
  else setInterval(function() { if (dirty) saveStateToCloud(); }, 30000);
}
async function pollCloud() {
  const cs = await loadStateFromCloud(CLOUD_STATE_KEY); if (!cs || !cs.timestamps) return;
  const j = JSON.stringify(cs); if (j === lastCloudJSON) return; lastCloudJSON = j;
  S = Object.assign(freshState(), cs); backfill();
  document.getElementById('saveIndicator').textContent = '👀 Mirror updated ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  RENDER[activeTab](); updateTabBadges();
}
function backfill() {
  const f = freshState();

  if (!S.paint.colors) S.paint.colors = ['', '', '', ''];
  if (!S.plan.ways) S.plan.ways = ['', '']; if (!S.plan.examples) S.plan.examples = ['', ''];
  if (!S.write.sentences || S.write.sentences.length < 4) S.write.sentences = f.write.sentences;
