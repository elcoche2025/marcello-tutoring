function clearDrag(){
  if(drag?.raf)cancelAnimationFrame(drag.raf);
  document.querySelector('.drag-ghost')?.remove();document.querySelectorAll('.drop-hover,.drag-origin').forEach(el=>el.classList.remove('drop-hover','drag-origin'));document.body.classList.remove('is-dragging');drag=null;
}
function autoScroll(){
  if(!drag?.active)return;
  const margin=76;
  let delta=0;
  if(drag.y<margin)delta=-Math.max(4,(margin-drag.y)/4);
  else if(drag.y>innerHeight-margin)delta=Math.max(4,(drag.y-innerHeight+margin)/4);
  if(delta)window.scrollBy(0,delta);
  drag.raf=requestAnimationFrame(autoScroll);
}
document.addEventListener('pointerdown',event=>{
  if(groupKey()==='detective'||session().success||event.button!==0)return;
  const item=event.target.closest('[data-item]');if(!item||event.target.closest('.card-tools'))return;
  if(event.pointerType==='touch'&&!event.target.closest('[data-drag]'))return;
  if(event.target.closest('[data-action="read-card"],[data-action="return-card"]'))return;
  drag={id:Number(item.dataset.item),startX:event.clientX,startY:event.clientY,x:event.clientX,y:event.clientY,active:false,origin:item,pointerId:event.pointerId};
});
document.addEventListener('pointermove',event=>{
  if(!drag||event.pointerId!==drag.pointerId)return;
  drag.x=event.clientX;drag.y=event.clientY;
  if(!drag.active&&Math.hypot(event.clientX-drag.startX,event.clientY-drag.startY)<7)return;
  if(event.cancelable)event.preventDefault();
  if(!drag.active){drag.active=true;document.body.classList.add('is-dragging');drag.origin.classList.add('drag-origin');const ghost=document.createElement('div');ghost.className='drag-ghost';ghost.textContent=texts()[drag.id];ghost.style.width=Math.min(380,innerWidth-32)+'px';ghost.setAttribute('aria-hidden','true');document.body.append(ghost);drag.raf=requestAnimationFrame(autoScroll);announce('Dragging card. Drop it on a numbered spot.');}
  const ghost=document.querySelector('.drag-ghost');if(ghost){ghost.style.left=Math.min(Math.max(8,event.clientX-70),innerWidth-ghost.offsetWidth-8)+'px';ghost.style.top=(event.clientY+17)+'px';}
  document.querySelectorAll('.drop-hover').forEach(el=>el.classList.remove('drop-hover'));dropElement(event.clientX,event.clientY)?.classList.add('drop-hover');
},{passive:false});
document.addEventListener('pointerup',event=>{
  if(!drag||event.pointerId!==drag.pointerId)return;
  if(!drag.active){drag=null;return;}
  const id=drag.id,target=dropElement(event.clientX,event.clientY)?.dataset.drop;
  suppressClickUntil=Date.now()+350;clearDrag();
  if(target==='bank')returnCard(id);
  else if(target!==undefined)placeCard(id,Number(target));
  else announce('Card returned to where it was. Drop onto a numbered spot to move it.');
});
document.addEventListener('pointercancel',clearDrag);
window.addEventListener('blur',clearDrag);
document.addEventListener('dragstart',event=>{if(event.target.closest('[data-item]'))event.preventDefault();});
function openGuide(){
  stopSpeech();$('#guide-content').innerHTML=`<div class="dialog-top"><h2>A small guide to Word Garden</h2><button class="icon-button" data-action="close-dialog" aria-label="Close guide">${icon('close',20)}</button></div><p>Short, familiar writing tasks for a learner beginning fourth grade who benefits from clear language and extra support.</p><h3>Three ways to practice</h3><ol><li><b>Paragraph mode:</b> Put five sentences in order. Find the topic sentence, supporting details, and closing.</li><li><b>Essay mode → Put paragraphs in order:</b> Build a short four-paragraph essay with an introduction, two body paragraphs, and a conclusion.</li><li><b>Essay mode → Paragraph detective:</b> Choose an introduction, conclusion, relevant body paragraph, or paragraph that does not belong. Then explain why by choosing a reason.</li></ol><h3>Make the task fit the learner</h3><p>Start with <b>Show part clues</b> on. Read the prompt together. Ask, “What job does this part do?” Later, turn the clues off. Use <b>Read aloud</b>, a card’s speaker button, or <b>Give me a hint</b> as needed. There are no timers, lost points, or limits on retries.</p><h3>Move cards your way</h3><p>Drag with a mouse, or drag the dotted handle on a touchscreen. You can always tap a card and then a numbered spot. Tap one placed card and then another to swap them. The small × returns a card to the bank. With a keyboard, Tab to a card, press Enter to select it, then Tab to a spot and press Enter. Arrow keys are also available to navigate positions.</p><h3>About the answer checking</h3><p>Some independent details can go in more than one sensible order; those alternatives are accepted. Steps and stories with time clues need a connected sequence. In longer writing, structure can vary: these four-paragraph essays are practice models, not rules for every essay.</p><h3>Progress and privacy</h3><p>Includes <b>${PARAGRAPHS.length} paragraph sorts, ${ESSAYS.length} essay sorts, and ${DETECTIVES.length} two-part detective challenges</b>. Earn one leaf for completing an activity, no matter how many tries it takes. Repeating an activity does not add extra leaves. Progress is stored only in this browser when browser storage is available. No names, accounts, ads, analytics, or app-initiated network requests. Device read-aloud services may use a network voice. Read-aloud availability depends on the browser and installed voices.</p><p style="margin-top:12px">The supplied practice texts are original. These are practice activities, not a standardized reading-level assessment.</p><div class="dialog-actions"><button class="primary" data-action="close-dialog">Let’s build${icon('arrow',18)}</button><button class="text-button" data-action="clear-progress">Clear saved progress</button></div>`;
  $('#guide-dialog').showModal();
}
function showClearConfirmation(){
  $('#guide-content').innerHTML=`<div class="dialog-top"><h2>Clear this browser’s progress?</h2><button class="icon-button" data-action="close-dialog" aria-label="Close guide">${icon('close',20)}</button></div><p>This removes the ${state.completed.size} saved completion${state.completed.size===1?'':'s'} and resets the current practice. This cannot be undone.</p><div class="dialog-actions"><button class="secondary" data-action="close-dialog">Keep my progress</button><button class="primary" data-action="confirm-clear">Clear progress</button></div>`;
}
$('#guide-dialog').addEventListener('click',event=>{if(event.target===$('#guide-dialog')){const rect=event.target.getBoundingClientRect();if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)event.target.close();}});
window.addEventListener('pagehide',()=>{stopSpeech();persist();});
render();

</script>
