    '<p class="directions">Same games as last week, new puzzles. First a <strong>paragraph</strong> cut into strips, then an <strong>essay</strong> with its paragraphs mixed up. Both are about someone with a great heart — notice how the proof 2 paragraph and the conclusion work, because you write yours today.</p>' +
    '<div class="puzzle-tabs"><button class="puzzle-tab ' + (scrambleView === 'para' ? 'active ' : '') + (sc.para.solved ? 'solved' : '') + '" onclick="setScrambleView(\'para\')">' + (sc.para.solved ? '✓ ' : '') + '✂️ Paragraph: ' + esc(SCRAMBLE_PARA.title) + '</button><button class="puzzle-tab ' + (scrambleView === 'essay' ? 'active ' : '') + (sc.essay.solved ? 'solved' : '') + '" onclick="setScrambleView(\'essay\')">' + (sc.essay.solved ? '✓ ' : '') + '📄 Essay: ' + esc(SCRAMBLE_ESSAY.title) + '</button></div>' +
    '<div class="info-box">' + (scrambleView === 'para' ? '👆 Which sentence tells what the whole paragraph is about? That goes first. Then follow the story.' : '👆 Which paragraph has the focus statement (who + two reasons)? Red goes first. Which says First? Second? Which wraps it up?') + '</div>' +
    '<div class="strips" id="strips">';
  cur.order.forEach(function(orig, pos) {
    html += '<div class="strip" data-orig="' + orig + '"><span class="slot">' + (pos + 1) + '</span>' + esc(items[orig]) + '<span class="grip"><button onclick="scrMove(' + pos + ',-1)" ' + (pos === 0 || cur.solved ? 'disabled' : '') + '>▲</button><button onclick="scrMove(' + pos + ',1)" ' + (pos === cur.order.length - 1 || cur.solved ? 'disabled' : '') + '>▼</button></span></div>';
  });

function scrMove(pos, dir) { const cur = S.scramble[scrambleView]; if (cur.solved) return; const to = pos + dir; if (to < 0 || to >= cur.order.length) return; const t = cur.order[pos]; cur.order[pos] = cur.order[to]; cur.order[to] = t; renderScramble(); debounceSave(); }
function scrShuffle() { const cur = S.scramble[scrambleView]; if (cur.solved) return; cur.order = shuffled(cur.order.length); renderScramble(); debounceSave(); }
function paintSolved() {
  const strips = document.querySelectorAll('#strips .strip');

}

function finishScramble() { if (!(S.scramble.para.solved && S.scramble.essay.solved)) return; S.scramble.done = true; S.timestamps.scrambleEnd = new Date().toISOString(); toast('Structure: warmed up 🧩'); saveImmediate(); updateTabBadges(); switchTab('fixit'); }
// pointer-event drag with DOCUMENT listeners (moving the strip in the DOM releases pointer capture — see build guide §3)

  html += '</div>'; if (st.correct) html += '<div class="feedback ok">✓ ' + okMsg + '</div>'; else if (st.picked) html += '<div class="feedback hint">🤔 ' + hintMsg + '</div>'; return html + '</div>';
}
function blankSentence(before, after, filled) { return esc(before) + '<span class="blank ' + (filled ? 'filled' : '') + '">' + (filled ? esc(filled) : '______') + '</span>' + esc(after); }
