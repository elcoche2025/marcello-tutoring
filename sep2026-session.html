<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marcello's Session — September 2, 2026 (Welcome Back to 4th Grade 🍂)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --teal: #00897B; --teal-light: #E0F2F1; --teal-dark: #00695C;
    --blue: #4472C4; --blue-light: #D9E2F3;
    --green: #4CAF50; --green-light: #E8F5E9;
    --gold: #F5B700; --gold-light: #FFF8E1; --gold-dark: #B7791F;
    --orange: #FB8C00; --orange-light: #FFF3E0;
    --red: #E53935; --red-light: #FFEBEE;
    --purple: #9C27B0; --purple-light: #F3E5F5;
    --leaf: #E65100; --leaf2: #F57C00; --sky: #29B6F6; --sky-light: #E1F5FE;
    --bg: #F6F8F4; --card: #FFFFFF;
    --text: #2D3748; --muted: #718096;
    --radius: 16px; --shadow: 0 4px 20px rgba(0,0,0,0.08);
  }
  body { font-family: 'Nunito', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 80px; }
  header {
    background: linear-gradient(135deg, #BF360C 0%, #E65100 40%, #FB8C00 100%);
    color: white; text-align: center; padding: 24px 20px 48px; position: relative;
  }
  header::after { content: ''; position: absolute; bottom: -2px; left: 0; right: 0; height: 36px; background: var(--bg); border-radius: 50% 50% 0 0; }
  header h1 { font-size: 1.8rem; font-weight: 800; margin-bottom: 2px; text-shadow: 0 2px 6px rgba(0,0,0,0.12); }
  header p { font-size: 0.95rem; opacity: 0.95; }
  .save-indicator { position: absolute; top: 10px; right: 16px; font-size: 0.75rem; opacity: 0.8; transition: opacity 0.3s; }
  .save-indicator.flash { opacity: 1; }
  .tutor-reset { position: absolute; top: 10px; left: 16px; font-size: 0.7rem; padding: 4px 10px; border-radius: 12px; background: rgba(255,255,255,0.18); border: 1px solid rgba(255,255,255,0.35); color: white; cursor: pointer; font-family: 'Nunito', sans-serif; font-weight: 700; opacity: 0.6; transition: opacity 0.2s; }
  .tutor-reset:hover { opacity: 1; background: rgba(255,255,255,0.3); }

  .main-tabs { display: flex; justify-content: center; gap: 6px; padding: 10px 8px 0; max-width: 800px; margin: 0 auto; flex-wrap: wrap; position: relative; z-index: 2; }
  .main-tab {
    padding: 10px 14px; border-radius: 12px; font-weight: 700; font-size: 0.82rem;
    cursor: pointer; transition: all 0.25s; border: 2px solid #D0D5DD;
    background: white; color: var(--muted);
    font-family: 'Nunito', sans-serif; white-space: nowrap;
  }
  .main-tab:hover { border-color: var(--orange); color: var(--orange); }
  .main-tab.active { background: var(--orange); border-color: var(--orange); color: white; box-shadow: 0 3px 12px rgba(251,140,0,0.35); transform: translateY(-2px); }
  .main-tab.done { border-color: var(--green); color: var(--green); }
  .main-tab.active.done { background: var(--green); border-color: var(--green); color: white; }

  .container { max-width: 760px; margin: 16px auto; padding: 0 16px; }
  .container.wide { max-width: 1000px; }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }
  .card { background: white; border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px; margin-bottom: 16px; animation: fadeUp 0.35s ease; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  .card h2 { font-size: 1.25rem; font-weight: 800; margin-bottom: 6px; }
  .card .directions { font-size: 0.92rem; color: var(--muted); margin-bottom: 14px; line-height: 1.5; }

  .review-banner { display: flex; align-items: center; gap: 8px; background: var(--green-light); border: 2px solid var(--green); border-radius: 12px; padding: 10px 14px; margin-bottom: 14px; font-size: 0.88rem; color: #2E7D32; font-weight: 700; }
  .info-box { background: var(--sky-light); border-left: 4px solid var(--sky); border-radius: 0 10px 10px 0; padding: 12px 16px; margin-bottom: 14px; font-weight: 600; line-height: 1.5; font-size: 0.92rem; color: #01579B; }

  .btn { padding: 12px 24px; border-radius: 12px; font-weight: 700; font-size: 0.95rem; cursor: pointer; border: none; font-family: 'Nunito', sans-serif; transition: all 0.2s; }
  .btn:hover { transform: translateY(-1px); filter: brightness(1.05); }
  .btn:active { transform: translateY(0); }
  .btn-primary { background: var(--teal); color: white; }
  .btn-success { background: var(--green); color: white; }
  .btn-orange { background: var(--orange); color: white; }
  .btn-purple { background: var(--purple); color: white; }
  .btn-blue { background: var(--blue); color: white; }
  .btn-gold { background: var(--gold); color: #5D4037; }
  .btn-secondary { background: #E0E0E0; color: var(--text); }
  .btn-sm { padding: 8px 14px; font-size: 0.85rem; border-radius: 10px; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .btn-row { display: flex; gap: 10px; justify-content: center; margin-top: 16px; flex-wrap: wrap; }

  /* Tab 1: Welcome-back interview */
  .q-card { background: white; border: 2px solid #E0E0E0; border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; transition: all 0.25s; }
  .q-card.done { border-color: var(--green); background: #FAFFFB; }
  .q-title { font-weight: 800; font-size: 1rem; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
  .q-title .q-num { background: var(--orange); color: white; border-radius: 50%; width: 26px; height: 26px; display: inline-flex; align-items: center; justify-content: center; font-size: 0.8rem; flex-shrink: 0; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .chip { padding: 8px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: 700; background: white; border: 2px solid #B2DFDB; color: var(--teal-dark); cursor: pointer; font-family: 'Nunito', sans-serif; transition: all 0.2s; }
  .chip:hover { border-color: var(--teal); transform: translateY(-1px); }
  .chip.active { background: var(--teal); color: white; border-color: var(--teal); }
  .chip.used { opacity: 0.35; text-decoration: line-through; cursor: not-allowed; }
  .text-input-wrap { position: relative; }
  .text-input { width: 100%; padding: 10px 44px 10px 12px; border: 2px solid #D0D5DD; border-radius: 10px; font-family: 'Nunito', sans-serif; font-size: 0.95rem; font-weight: 600; background: #FAFBFC; }
  .text-input:focus { border-color: var(--orange); outline: none; background: white; }
  .mini-mic { position: absolute; top: 6px; right: 6px; width: 32px; height: 32px; border-radius: 50%; background: var(--orange-light); border: 2px solid var(--orange); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 0.9rem; }
  .mini-mic.recording { background: var(--red); border-color: var(--red); color: white; animation: pulse 1.2s infinite; }
  .topic-box { background: var(--orange-light); border: 2px dashed var(--orange); border-radius: 12px; padding: 14px 16px; margin-top: 6px; }
  .topic-box .tb-label { font-size: 0.72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; color: var(--leaf); margin-bottom: 6px; }

  /* Tab 2: Reading warm-up — word mapping */
  .word-card { background: white; border: 2px solid #E0E0E0; border-radius: 14px; padding: 16px 18px; margin-bottom: 12px; text-align: center; transition: all 0.25s; }
  .word-card.done { border-color: var(--green); background: #FAFFFB; }
  .word-big { font-size: 2.1rem; font-weight: 800; letter-spacing: 1px; color: var(--text); margin-bottom: 4px; }
  .word-big .tricky { color: var(--red); background: var(--gold-light); border-radius: 6px; padding: 0 4px; }
  .word-syll { font-size: 0.95rem; color: var(--muted); font-weight: 700; letter-spacing: 2px; margin-bottom: 10px; }
  .word-tip { font-size: 0.84rem; color: var(--gold-dark); font-weight: 700; margin-bottom: 10px; min-height: 20px; }
  .word-btns { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

  .prosody-box { background: var(--sky-light); border: 2px solid var(--sky); border-radius: 14px; padding: 18px; margin-bottom: 12px; }
  .prosody-text { font-size: 1.15rem; line-height: 1.9; font-weight: 600; color: var(--text); margin-bottom: 12px; }
  .score-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
  .score-row label { font-size: 0.82rem; font-weight: 700; color: var(--muted); }
  .score-input { width: 70px; padding: 8px 10px; border: 2px solid #D0D5DD; border-radius: 10px; font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 0.95rem; text-align: center; }
  .score-input:focus { border-color: var(--teal); outline: none; }
  .tutor-tag { font-size: 0.68rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); background: #ECEFF1; border-radius: 8px; padding: 2px 8px; }
  .timer-btn { font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 0.85rem; padding: 7px 12px; border-radius: 10px; border: 2px solid var(--blue); background: white; color: var(--blue); cursor: pointer; min-width: 92px; }
  .timer-btn.running { background: var(--blue); color: white; }
  .timer-btn.finished { background: var(--green); border-color: var(--green); color: white; }

  /* Tab 3: Word Detective */
  .rule-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 8px 0 14px; }
  @media (max-width: 560px) { .rule-grid { grid-template-columns: 1fr; } }
  .rule-card { background: var(--purple-light); border: 2px solid #CE93D8; border-radius: 12px; padding: 12px 14px; cursor: pointer; transition: all 0.2s; }
  .rule-card:hover { border-color: var(--purple); transform: translateY(-1px); }
  .rule-card.seen { border-color: var(--purple); background: #FBF3FD; }
  .rule-words { font-weight: 800; font-size: 1.05rem; color: var(--purple); margin-bottom: 6px; }
  .rule-line { font-size: 0.85rem; line-height: 1.45; color: #4A148C; }
  .rule-line b { color: var(--purple); }
  .rule-test { font-size: 0.8rem; color: #6A1B9A; font-weight: 700; margin-top: 6px; }
  .case-card { background: white; border: 2px solid #E0E0E0; border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; transition: all 0.25s; }
  .case-card.correct { border-color: var(--green); background: #FAFFFB; }
  .case-sentence { font-size: 1.15rem; font-weight: 700; line-height: 1.6; margin-bottom: 10px; }
  .case-sentence .blank { display: inline-block; min-width: 90px; border-bottom: 3px solid var(--orange); text-align: center; color: var(--orange); font-weight: 800; padding: 0 6px; }
  .case-sentence .blank.filled { color: #2E7D32; border-color: var(--green); }
  .case-opts { display: flex; gap: 8px; flex-wrap: wrap; }
  .case-opt { padding: 9px 18px; border-radius: 20px; font-size: 1rem; font-weight: 800; border: 2px solid #CE93D8; background: white; color: var(--purple); cursor: pointer; font-family: 'Nunito', sans-serif; transition: all 0.2s; }
  .case-opt:hover { border-color: var(--purple); transform: translateY(-1px); }
  .case-opt.right { background: var(--green); border-color: var(--green); color: white; }
  .case-opt.wrong { background: var(--red-light); border-color: var(--red); color: var(--red); text-decoration: line-through; }
  .case-feedback { margin-top: 10px; font-size: 0.88rem; font-weight: 700; line-height: 1.45; border-radius: 10px; padding: 9px 12px; }
  .case-feedback.ok { background: var(--green-light); color: #2E7D32; }
  .case-feedback.hint { background: var(--gold-light); color: #7B6400; }

  /* Tab 4: Summer Story */
  .story-canvas-wrap { background: #FAFBFC; border: 2px dashed #B0BEC5; border-radius: 12px; padding: 10px; text-align: center; max-width: 360px; margin: 0 auto 12px; }
  .story-canvas { width: 320px; height: 220px; background: white; border-radius: 8px; cursor: crosshair; touch-action: none; border: 1px solid #D0D5DD; display: block; margin: 0 auto; max-width: 100%; }
  .canvas-tools { display: flex; justify-content: center; gap: 6px; margin-top: 8px; align-items: center; flex-wrap: wrap; }
  .canvas-tools .tool-btn { font-size: 0.78rem; padding: 5px 11px; border-radius: 8px; background: #F0F0F0; border: 1px solid #B0BEC5; cursor: pointer; font-family: 'Nunito', sans-serif; font-weight: 700; }
  .canvas-tools .tool-btn.danger { color: var(--red); border-color: #FFB3B3; }
  .canvas-tools .tool-btn.mode-btn.active { background: var(--orange); color: #fff; border-color: var(--orange); }
  .swatches { display: inline-flex; gap: 5px; align-items: center; padding: 0 2px; }
  .swatch { width: 24px; height: 24px; border-radius: 50%; border: 2px solid #cfd8dc; cursor: pointer; padding: 0; }
  .swatch.active { border-color: #263238; box-shadow: 0 0 0 2px #fff, 0 0 0 4px #263238; }
  .label-input { width: 100%; max-width: 360px; margin: 0 auto 12px; display: block; padding: 10px 12px; border: 2px solid #D0D5DD; border-radius: 10px; font-family: 'Nunito', sans-serif; font-size: 0.95rem; font-weight: 600; }
  .label-input:focus { border-color: var(--orange); outline: none; }
  .gist-anchor { background: var(--orange-light); border: 2px solid #FFCC80; border-radius: 10px; padding: 8px 14px; margin: 0 auto 10px; max-width: 520px; text-align: center; font-weight: 800; font-size: 0.92rem; color: var(--leaf); }

  .write-card { background: white; border: 2px solid #E0E0E0; border-radius: 16px; padding: 18px 20px; margin-bottom: 16px; transition: all 0.25s; }
  .write-card.locked { background: var(--green-light); border-color: var(--green); }
  .write-card.dialogue { border-color: var(--gold); }
  .write-card.feeling { border-color: #CE93D8; }
  .write-card.locked { border-color: var(--green); }
  .write-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 8px; }
  .write-card-title { font-size: 1.05rem; font-weight: 800; color: var(--orange); }
  .write-card-title.dialogue { color: var(--gold-dark); }
  .write-card-title.feeling { color: var(--purple); }
  .write-card-title.locked { color: var(--green); }
  .write-badge { font-size: 0.72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; padding: 3px 10px; border-radius: 12px; }
  .write-badge.narr { background: var(--orange-light); color: var(--orange); }
  .write-badge.dlg { background: var(--gold-light); color: var(--gold-dark); }
  .write-badge.feel { background: var(--purple-light); color: var(--purple); }
  .prompt-line { font-size: 0.95rem; font-weight: 700; color: var(--text); margin-bottom: 8px; line-height: 1.5; }
  .territory { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .territory span { font-size: 0.76rem; font-weight: 700; padding: 4px 10px; border-radius: 10px; }
  .territory .must { background: var(--green-light); color: #2E7D32; }
  .territory .not { background: var(--red-light); color: #B71C1C; }
  .feel-bank { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .feel-bank .bank-label { font-size: 0.74rem; font-weight: 800; color: var(--muted); text-transform: uppercase; width: 100%; letter-spacing: 0.5px; }
  .feel-chip { padding: 6px 12px; border-radius: 16px; font-size: 0.85rem; font-weight: 700; border: 2px solid #CE93D8; background: white; color: var(--purple); cursor: pointer; font-family: 'Nunito', sans-serif; }
  .feel-chip.glue { border-color: #90CAF9; color: #1565C0; }
  .feel-chip.used { opacity: 0.35; text-decoration: line-through; cursor: not-allowed; }

  /* Dialogue builder (W.4.3.b) */
  .dlg-builder { background: var(--gold-light); border: 2px solid var(--gold); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
  .dlg-builder-title { font-size: 0.95rem; font-weight: 800; color: var(--gold-dark); margin-bottom: 4px; }
  .dlg-builder-sub { font-size: 0.82rem; color: #8D6E13; margin-bottom: 12px; line-height: 1.4; }
  .dlg-chant { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: white; border: 2px dashed var(--orange); border-radius: 10px; padding: 9px 13px; margin-bottom: 12px; cursor: pointer; transition: all 0.2s; }
  .dlg-chant:hover { background: var(--orange-light); }
  .dlg-chant-label { font-size: 0.66rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; color: var(--orange); }
  .dlg-chant-words { font-size: 0.98rem; font-weight: 800; color: var(--text); }
  .dlg-chant-spk { margin-left: auto; font-size: 1.15rem; }
  .dlg-step-label { font-size: 0.85rem; font-weight: 800; color: #5D4037; margin: 10px 0 6px; }
  .dlg-chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .dlg-chip { padding: 8px 16px; border-radius: 20px; font-size: 0.9rem; font-weight: 700; border: 2px solid #E0C97A; background: white; color: #8D6E13; cursor: pointer; font-family: 'Nunito', sans-serif; transition: all 0.2s; }
  .dlg-chip:hover { border-color: var(--gold); transform: translateY(-1px); }
  .dlg-chip.active { background: var(--gold); color: #5D4037; border-color: var(--gold); }
  .dlg-words-input { width: 100%; padding: 11px 14px; border: 2px solid #E0C97A; border-radius: 10px; font-family: 'Nunito', sans-serif; font-size: 1rem; font-weight: 600; background: white; }
  .dlg-words-input:focus { border-color: var(--gold); outline: none; }
  .dlg-preview { background: white; border: 2px dashed var(--gold); border-radius: 10px; padding: 12px 14px; margin-top: 12px; font-size: 1.05rem; font-weight: 700; line-height: 1.5; color: var(--text); }
  .dlg-preview .q { color: var(--red); font-weight: 800; }
  .dlg-preview .who { color: var(--gold-dark); }
  .dlg-hint { font-size: 0.8rem; color: #8D6E13; margin-top: 8px; line-height: 1.4; }
  .dlg-use-row { margin-top: 10px; }

  .write-textarea-wrap { position: relative; }
  .write-textarea { width: 100%; min-height: 80px; border: 2px solid #D0D5DD; border-radius: 12px; padding: 14px 50px 14px 14px; font-family: 'Nunito', sans-serif; font-size: 1rem; font-weight: 600; resize: vertical; line-height: 1.6; background: #FAFBFC; }
  .write-textarea:focus { border-color: var(--orange); outline: none; background: white; }
  .write-textarea.locked { background: white; border-color: var(--green); }
  .mic-btn { position: absolute; top: 10px; right: 10px; width: 36px; height: 36px; border-radius: 50%; background: var(--orange-light); border: 2px solid var(--orange); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1rem; transition: all 0.2s; }
  .mic-btn:hover { background: var(--orange); color: white; }
  .mic-btn.recording { background: var(--red); border-color: var(--red); color: white; animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(229,57,53,0.5); } 50% { box-shadow: 0 0 0 8px rgba(229,57,53,0); } }

  .source-check { background: #FFFDE7; border: 2px solid var(--gold); border-radius: 12px; padding: 12px 14px; margin-top: 12px; }
  .source-check.matched { background: var(--green-light); border-color: var(--green); }
  .source-check.unmatched { background: var(--red-light); border-color: var(--red); }
  .source-check-prompt { font-size: 0.92rem; line-height: 1.5; font-weight: 600; margin-bottom: 10px; color: #5D4037; }
  .source-check-row { display: flex; gap: 8px; }
  .source-btn { flex: 1; padding: 10px; border-radius: 10px; font-weight: 700; font-size: 0.85rem; border: 2px solid; cursor: pointer; font-family: 'Nunito', sans-serif; transition: all 0.2s; }
  .source-btn.match { background: white; color: var(--green); border-color: var(--green); }
  .source-btn.match.active { background: var(--green); color: white; }
  .source-btn.unmatch { background: white; color: var(--red); border-color: var(--red); }
  .source-btn.unmatch.active { background: var(--red); color: white; }

  /* Finger-point word-by-word proofread (standing since Jun 8) */
  .proof-box { background: var(--purple-light); border: 2px solid var(--purple); border-radius: 12px; padding: 14px 16px; margin-top: 12px; }
  .proof-box.done { background: var(--green-light); border-color: var(--green); }
  .proof-title { font-size: 0.92rem; font-weight: 800; color: var(--purple); margin-bottom: 4px; }
  .proof-box.done .proof-title { color: var(--green); }
  .proof-sub { font-size: 0.82rem; color: #6A1B9A; margin-bottom: 12px; line-height: 1.4; }
  .proof-box.done .proof-sub { color: #2E7D32; }
  .proof-words { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .proof-word {
    padding: 8px 12px; border-radius: 10px; font-size: 1.05rem; font-weight: 700;
    border: 2px solid #D1C4E9; background: white; color: #B0A8C0; cursor: default;
    font-family: 'Nunito', sans-serif; transition: all 0.18s;
  }
  .proof-word.next { color: var(--purple); border-color: var(--purple); cursor: pointer; animation: pulseP 1.3s infinite; box-shadow: 0 0 0 0 rgba(156,39,176,0.5); }
  @keyframes pulseP { 0%,100% { box-shadow: 0 0 0 0 rgba(156,39,176,0.4); } 50% { box-shadow: 0 0 0 7px rgba(156,39,176,0); } }
  .proof-word.read { color: #2E7D32; border-color: var(--green); background: var(--green-light); cursor: default; }
  .proof-word.read::after { content: ' ✓'; font-size: 0.8rem; }
  .proof-progress { font-size: 0.8rem; color: var(--muted); font-weight: 700; margin-top: 10px; }

  /* NEW — Sound-alike (homophone) meaning check */
  .homo-box { background: #E3F2FD; border: 2px solid #1E88E5; border-radius: 12px; padding: 14px 16px; margin-top: 12px; }
  .homo-box.done { background: var(--green-light); border-color: var(--green); }

function toast(msg, kind) {

function loadFromLocalStorage() {

let saveDebounce = null, cloudDebounce = null;
let cloudFireDeadline = null;
function debounceSave() {
  if (VIEW_ONLY) return;
  dirty = true;
  clearTimeout(saveDebounce);
  saveDebounce = setTimeout(saveToLocalStorage, 500);
  const now = Date.now();
  if (cloudFireDeadline === null) cloudFireDeadline = now + 8000;
  const remaining = Math.max(cloudFireDeadline - now, 0);
  const fireIn = Math.min(3500, remaining);
  clearTimeout(cloudDebounce);
  cloudDebounce = setTimeout(function() { cloudFireDeadline = null; saveStateToCloud(); }, fireIn);
}
function saveImmediate() {
  if (VIEW_ONLY) return;

  cloudFireDeadline = null;
  saveToLocalStorage();
  saveStateToCloud();
}

// Guard: never let a blank/fresh state overwrite a non-empty cloud blob (the 2026-06-08
// data-loss fix). If the in-memory state has no real work, we simply don't push it.
function stateHasWork() {

  } catch (e) { return true; }  // fail open — never block a save on a guard error
}
function saveStateToCloud() {
  if (VIEW_ONLY) return;         // a mirror never writes
  if (!stateHasWork()) return;  // don't clobber the cloud with an empty session
  try {
    fetch(TRACKER_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ sheet: 'Session State', key: CLOUD_STATE_KEY, state: S }) });

    setTimeout(function() { ind.classList.remove('flash'); }, 1000);

}
function loadStateFromCloud(key) {
  return new Promise(function(resolve) {
    const cbName = 'cloudCB_' + Date.now() + '_' + Math.random().toString(36).slice(2);
    const timeout = setTimeout(function() { delete window[cbName]; resolve(null); }, 8000);
    window[cbName] = function(result) {
      clearTimeout(timeout); delete window[cbName];
      if (result && result.success && result.state) resolve(result.state); else resolve(null);
    };
    const script = document.createElement('script');
    script.src = TRACKER_URL + '?action=loadState&key=' + encodeURIComponent(key) + '&callback=' + cbName;
    script.onerror = function() { clearTimeout(timeout); delete window[cbName]; resolve(null); };
    document.head.appendChild(script);
  });
}

function detectiveCase(i) {
  if (!S.detective.cases[i]) S.detective.cases[i] = { picked: '', tries: 0, correct: false };
  return S.detective.cases[i];
}
function detectiveReady() { return CASES.every(function(c, i) { return detectiveCase(i).correct; }); }
function renderDetective() {
  const el = document.getElementById('card-detective');
  const d = S.detective;
  const solved = CASES.filter(function(c, i) { return detectiveCase(i).correct; }).length;

  let html =
    '<div class="card">' +
    (d.done ? '<div class="review-banner">✅ Word Detective solved. Tap back any time.</div>' : '') +
    '<h2>🔍 Word Detective</h2>' +
    '<p class="directions">Some words <strong>sound exactly the same</strong> but are spelled differently and mean different things. Your ear can’t tell them apart — only your <strong>eyes and the meaning</strong> can. Tap each rule card to hear it, then solve the cases.</p>' +
    '<div class="info-box">🕵️ The trick: don’t listen — ask <strong>what does it MEAN?</strong> A place? Belongs to someone? Or two words squished together with an apostrophe?</div>' +
    '<div class="rule-grid">';
  RULES.forEach(function(r, i) {
    html += '<div class="rule-card ' + (d.rulesSeen[i] ? 'seen' : '') + '" onclick="seeRule(' + i + ')">' +
      '<div class="rule-words">' + esc(r.words) + ' ' + (d.rulesSeen[i] ? '🔊' : '') + '</div>';
    r.lines.forEach(function(l) { html += '<div class="rule-line"><b>' + esc(l[0]) + '</b> = ' + esc(l[1]) + '</div>'; });
    html += '<div class="rule-test">' + esc(r.test) + '</div></div>';
  });
  html += '</div></div>';

  html += '<div class="card"><h2>🧩 Solve the cases <span style="font-size:0.85rem;color:var(--muted);font-weight:700;">(' + solved + ' of ' + CASES.length + ')</span></h2>' +
    '<p class="directions">Say the sentence out loud with each choice. Which one MEANS the right thing? Do the swap-test before you tap.</p></div>';

  CASES.forEach(function(c, i) {
    const st = detectiveCase(i);
    html += '<div class="case-card ' + (st.correct ? 'correct' : '') + '">' +
      '<div class="case-sentence">' + esc(c.before) + '<span class="blank ' + (st.correct ? 'filled' : '') + '">' + (st.correct ? esc(c.ans) : '______') + '</span>' + esc(c.after) + '</div>' +
      '<div class="case-opts">';
    c.opts.forEach(function(o) {
      let cls = 'case-opt';
      if (st.correct && o === c.ans) cls += ' right';
      else if (!st.correct && st.picked === o && o !== c.ans) cls += ' wrong';
      html += '<button class="' + cls + '" onclick="pickCase(' + i + ',' + attr(o) + ')" ' + (st.correct ? 'disabled' : '') + '>' + esc(o) + '</button>';
    });
    html += '</div>';
    if (st.correct) html += '<div class="case-feedback ok">✓ ' + esc(c.why) + (st.tries > 1 ? ' (took ' + st.tries + ' tries — and you got there!)' : '') + '</div>';
    else if (st.picked) html += '<div class="case-feedback hint">🤔 Not that one. ' + esc(c.hint) + '</div>';
    html += '</div>';
  });

  html += '<div class="btn-row"><button class="btn btn-success" onclick="finishDetective()" ' + (detectiveReady() ? '' : 'disabled') + '>' +
    (d.done ? '✓ On to my summer story →' : 'Cases solved — write my summer story →') + '</button></div>';
  if (!detectiveReady()) html += '<p style="text-align:center;font-size:0.83rem;color:var(--muted);font-style:italic;margin-top:6px;">Solve all ' + CASES.length + ' cases to continue.</p>';

  el.innerHTML = html;
}
function seeRule(i) { S.detective.rulesSeen[i] = true; speakText(RULES[i].say, 0.85); renderDetective(); debounceSave(); }
function pickCase(i, word) {
  const st = detectiveCase(i);
  if (st.correct) return;
  st.tries += 1;
  st.picked = word;
  if (word === CASES[i].ans) {
    st.correct = true;
    toast('Case solved! 🕵️✓');
    if (detectiveReady()) fireCelebration();
  } else {
    toast('Try the swap-test 🔁', 'warning');
  }
  renderDetective(); debounceSave();
}
function finishDetective() {
  if (!detectiveReady()) return;

    'First-try correct: ' + firstTry + '/' + CASES.length + ' | tries per case: ' + CASES.map(function(c, i) { return detectiveCase(i).tries; }).join(',')]);
  toast('Word Detective — case closed! 🔍');

function buildStorySentence(i, sent) {
  const isLocked = sent.locked;
  const mode = sent.mode;
  const text = sent.text || '';
  const prompts = {
    narrative: 'Tell what happened. Who was there? Where were you? What did you do?',
    dialogue: 'Make someone TALK. What did you say? What did your mom, dad, or friend say?',
    feeling: 'How did you feel — and WHY? Use a feeling word and a connecting word.'
  };
  const territory = {
    narrative: ['<span class="must">MUST: who + where + what happened</span>', '<span class="not">NOT YET: how you felt</span>'],
    dialogue: ['<span class="must">MUST: who + said + "the exact words"</span>', '<span class="not">NOT: what happened (that was sentence 1)</span>'],
    feeling: ['<span class="must">MUST: a feeling word + because / so / when</span>', '<span class="not">NOT: repeat sentence 1</span>']
  };
  const badge = { narrative: '<span class="write-badge narr">📝 Tell what happened</span>', dialogue: '<span class="write-badge dlg">🗣️ Talking sentence</span>', feeling: '<span class="write-badge feel">💜 Feeling + why</span>' };

  let html = '<div class="write-card ' + mode + ' ' + (isLocked ? 'locked' : '') + '">' +
    '<div class="write-card-header">' +
    '<div class="write-card-title ' + mode + ' ' + (isLocked ? 'locked' : '') + '">' + (isLocked ? '✓ ' : '') + 'Sentence ' + (i+1) + '</div>' +

    '</div>' +

    '<div class="territory">' + territory[mode].join('') + '</div>';

  if (mode === 'dialogue' && !isLocked) html += buildDialogueBuilder(i, sent);

  if (mode === 'feeling' && !isLocked) {
    const used = usedFeelings();
    html += '<div class="feel-bank"><span class="bank-label">Feeling words (greyed = already used)</span>';
    FEELINGS.forEach(function(f) {
      const u = used.indexOf(f) !== -1;
      html += '<button class="feel-chip ' + (u ? 'used' : '') + '" onclick="insertWord(' + i + ',' + attr(f) + ')" ' + (u ? 'disabled' : '') + '>' + esc(f) + '</button>';
    });
    html += '<span class="bank-label" style="margin-top:4px;">Connecting words</span>';

  }

  html += '<div class="write-textarea-wrap">' +
    '<textarea class="write-textarea ' + (isLocked ? 'locked' : '') + '" id="story-text-' + i + '" placeholder="' + placeholder + '" oninput="onStoryText(' + i + ')" ' + (isLocked ? 'readonly' : '') + '>' + esc(text) + '</textarea>' +
    '<button class="mic-btn" id="mic-' + i + '" onclick="toggleMic(' + i + ')" title="Speak → text drops in">🎤</button>' +
    '</div>';

  // Source check (against the drawing)

    const sprompt = mode === 'dialogue'

        : '🔍 <strong>Check.</strong> Look at your drawing. Look at your sentence. Do they tell the same thing?');
    html += '<div class="source-check ' + cls + '">' +
      '<div class="source-check-prompt">' + sprompt + '</div>' +
      '<div class="source-check-row">' +
      '<button class="source-btn match ' + (sent.sourceCheck === 'match' ? 'active' : '') + '" onclick="setSourceCheck(' + i + ',\'match\')">✓ Yes — it works</button>' +
      '<button class="source-btn unmatch ' + (sent.sourceCheck === 'unmatch' ? 'active' : '') + '" onclick="setSourceCheck(' + i + ',\'unmatch\')">✗ Not yet — let me look again</button>' +
      '</div></div>';
  }

  // Finger-point word-by-word proofread (shows once source-check matches)
  if (text.trim() && !isLocked && sent.sourceCheck === 'match') {

  }

  // NEW — sound-alike meaning check (shows once proofread is done)
  if (text.trim() && !isLocked && sent.sourceCheck === 'match' && sent.proofed) {
    html += buildHomoCheck(i, sent);
  }

  // Lock row
  if (!isLocked) {
    const canLock = text.trim() && sent.sourceCheck === 'match' && sent.proofed && homoPass(sent);
    html += '<div class="lock-row"><button class="lock-btn" onclick="lockStorySentence(' + i + ')" ' + (canLock ? '' : 'disabled') + '>🔒 Lock sentence ' + (i+1) + '</button></div>';
  } else {
    html += '<div class="lock-row"><button class="unlock-btn" onclick="unlockStorySentence(' + i + ')">✏️ Edit again</button></div>';
  }

  html += '</div>';
  return html;
}

function insertWord(i, word) {
  const sent = S.story.sentences[i];
  if (sent.locked) return;
  const ta = document.getElementById('story-text-' + i);
  const cur = sent.text || '';
  const needsSpace = cur && !/\s$/.test(cur);
  sent.text = cur + (needsSpace ? ' ' : '') + word + ' ';
  if (sent.sourceCheck === 'match') sent.sourceCheck = null;
  sent.proofed = false; sent.proofIdx = 0; sent.homo = {};
  renderStory();
  const ta2 = document.getElementById('story-text-' + i);
  if (ta2) { ta2.focus(); try { ta2.setSelectionRange(ta2.value.length, ta2.value.length); } catch(e) {} }
  debounceSave();
}

// === Finger-point proofread (standing) ===
function proofWords(sent) { return (sent.text || '').trim().split(/\s+/).filter(function(w) { return w.length; }); }
function buildProofread(i, sent) {
  const words = proofWords(sent);

    '<div class="proof-title">' + (done ? '✓ You read every word!' : '👆 Now check it word by word') + '</div>' +
    '<div class="proof-sub">' + (done
      ? 'You touched each word and read the REAL word on the page. That’s how you catch mistakes.'
      : 'Touch the glowing word and read ONLY that word out loud — slowly. Read what is REALLY there, not what you meant to write.') + '</div>' +
    '<div class="proof-words">';
  words.forEach(function(w, wi) {
    let cls = 'proof-word';
    if (wi < idx) cls += ' read';
    else if (wi === idx && !done) cls += ' next';
    html += '<span class="' + cls + '" ' + (wi === idx && !done ? 'onclick="proofTap(' + i + ')"' : '') + '>' + esc(w) + '</span>';
  });
  html += '</div>';
  if (!done) html += '<div class="proof-progress">' + idx + ' of ' + words.length + ' words read</div>' +
    '<div class="btn-row" style="justify-content:flex-start;margin-top:10px;"><button class="btn btn-sm btn-secondary" onclick="proofReset(' + i + ')">↻ Start over</button></div>';
  html += '</div>';
  return html;
}
function proofTap(i) {

    toast('You read every word! 👀✓');
    postToSheets('Activity Log', [SESSION_DATE, 'Marcello', 'Finger-point proofread (sentence ' + (i+1) + ')', 'Writing - Self-Monitoring', words.length, words.length, '100%', 'Read each word aloud one at a time: ' + sent.text.slice(0,120)]);
  }

}
function proofReset(i) {

}

// === NEW — Sound-alike (homophone) meaning check ===
function normWord(w) { return (w || '').toLowerCase().replace(/[’‘]/g, "'").replace(/[^a-z']/g, ''); }
function homoHits(sent) {

  words.forEach(function(w, wi) {

  });

}

}
function buildHomoCheck(i, sent) {
  const hits = homoHits(sent);
  const homo = sent.homo || {};

    return '<div class="homo-box done"><div class="homo-title">✓ Sound-alike check</div><div class="homo-sub">No sound-alike words in this sentence. Nothing to trap you here!</div></div>';
  }
  const allOk = homoPass(sent);
  const anyFix = hits.some(function(h) { return homo[h.idx] && homo[h.idx] !== h.written; });
  let html = '<div class="homo-box ' + (allOk ? 'done' : (anyFix ? 'fix' : '')) + '">' +
    '<div class="homo-title">' + (allOk ? '✓ Sound-alike check passed' : '🔍 Sound-alike check — Word Detective time') + '</div>' +
    '<div class="homo-sub">' + (allOk
      ? 'Every sound-alike word means what you wanted it to mean.'
      : 'Your sentence has a word that SOUNDS like another word. Your ear can’t tell — so look at the word and ask: which one did I MEAN?') + '</div>';
  hits.forEach(function(h) {
    const picked = homo[h.idx];
    const status = picked ? (picked === h.written ? 'ok' : 'fix') : '';
    html += '<div class="homo-item ' + status + '">' +
      '<div class="homo-q">You wrote <span class="hw">' + esc(h.written) + '</span>. Which one did you MEAN?</div>' +
      '<div class="homo-opts">';
    h.set.forEach(function(w) {
      const on = picked === w;
      const cls = 'homo-opt' + (on ? ' active ' + (w === h.written ? 'ok' : 'fix') : '');
      html += '<button class="' + cls + '" onclick="pickHomo(' + i + ',' + h.idx + ',' + attr(w) + ')">' + esc(MEANINGS[w] || w) + '</button>';
    });
    html += '</div>';
    if (status === 'ok') html += '<div class="homo-verdict ok">✓ Match — “' + esc(h.written) + '” means what you wanted.</div>';
    else if (status === 'fix') html += '<div class="homo-verdict fix">🔁 Then the word you need is <strong>' + esc(picked) + '</strong>, not “' + esc(h.written) + '.” Fix it in the box above — then check again.</div>';
    html += '</div>';
  });
  html += '</div>';
  return html;
}
function pickHomo(i, wordIdx, w) {
  const sent = S.story.sentences[i];
  if (sent.locked) return;
  if (!sent.homo) sent.homo = {};
  sent.homo[wordIdx] = w;
  const hits = homoHits(sent);
  const hit = hits.filter(function(h) { return h.idx === wordIdx; })[0];
  if (hit) {
    const ok = w === hit.written;
    postToSheets('Activity Log', [SESSION_DATE, 'Marcello', 'Sound-alike check (sentence ' + (i+1) + ')', 'Language - Confused Words', ok ? 1 : 0, 1, ok ? '100%' : '0%',
      'Wrote "' + hit.written + '", meant "' + w + '" — ' + (ok ? 'match' : 'MISMATCH, fix needed')]);
    if (ok) toast('Match ✓'); else toast('Good catch — fix it in the box 🔁', 'warning');
    if (ok && homoPass(sent) && hits.length) fireCelebration();
  }
  renderStory();
  debounceSave();
}

// === Dialogue builder (W.4.3.b) — same engine as last year ===
function buildDialogueBuilder(i, sent) {
  const d = sent.dlg || { who: '', tag: 'said', words: '' };
  let html = '<div class="dlg-builder">' +
    '<div class="dlg-builder-title">🗣️ Build a talking sentence (dialogue)</div>' +
    '<div class="dlg-builder-sub">When someone TALKS, put their exact words inside quotation marks " ". Build it one piece at a time.</div>' +
    '<div class="dlg-chant" onclick="speakText(\'Who is talking? What did they say? Hug the words.\', 0.9)" title="Say it out loud together — then tap to hear it.">' +
      '<span class="dlg-chant-label">📣 Say it<br>with me</span>' +
      '<span class="dlg-chant-words">"Who\'s talking? · What did they say? · Hug the words."</span>' +
      '<span class="dlg-chant-spk">🔊</span>' +
    '</div>';
  html += '<div class="dlg-step-label">1 · Who is talking?</div><div class="dlg-chips">';
  DLG_WHO.forEach(function(who) {
    const label = who === 'I' ? 'I (me)' : who;
    html += '<button class="dlg-chip ' + (d.who === who ? 'active' : '') + '" onclick="setDlgWho(' + i + ',' + attr(who) + ')">' + esc(label) + '</button>';
  });
  html += '</div>';
  html += '<div class="dlg-step-label">2 · What did they say? (the exact words — something a person could really SAY)</div>' +
    '<input class="dlg-words-input" id="dlg-words-' + i + '" placeholder="e.g., This is the best day ever" oninput="onDlgWords(' + i + ')" value="' + esc(d.words) + '">';
  html += '<div class="dlg-step-label">3 · Tell-word</div><div class="dlg-chips">';
  DLG_TAGS.forEach(function(tag) {
    html += '<button class="dlg-chip ' + (d.tag === tag ? 'active' : '') + '" onclick="setDlgTag(' + i + ',\'' + tag + '\')">' + tag + '</button>';
  });
  html += '</div>';
  html += '<div class="dlg-preview" id="dlg-preview-' + i + '">' + dlgPreviewHTML(d) + '</div>';
  html += '<div class="dlg-hint">💡 The quotation marks " " always hug the EXACT words. The tell-word (said / asked) tells the reader WHO is talking.</div>';
  html += '<div class="dlg-use-row"><button class="btn btn-gold btn-sm" id="dlg-use-' + i + '" onclick="useDialogue(' + i + ')" ' + (canAssemble(d) ? '' : 'disabled') + '>⬇️ Put it in the box</button></div>';
  html += '</div>';
  return html;
}
function canAssemble(d) { return d && d.who && d.tag && d.words && d.words.trim().length > 0; }
function assembleDialogue(d) {
  const who = d.who || '____';
  const tag = d.tag || 'said';
  let words = (d.words || '').trim().replace(/[.?!]+$/, '');
  if (words.length) words = words.charAt(0).toUpperCase() + words.slice(1);
  const end = tag === 'asked' ? '?' : (tag === 'shouted' ? '!' : '.');
  return who + ' ' + tag + ', "' + words + end + '"';
}
function dlgPreviewHTML(d) {
  if (!d || (!d.who && !d.words)) return '<span style="color:var(--muted);font-weight:600;">Your talking sentence will appear here as you build it…</span>';
  const who = d.who ? '<span class="who">' + esc(d.who) + '</span>' : '<span style="color:var(--muted);">____</span>';
  const tag = d.tag || 'said';
  let words = (d.words || '').trim().replace(/[.?!]+$/, '');
  if (words.length) words = words.charAt(0).toUpperCase() + words.slice(1);
  const end = tag === 'asked' ? '?' : (tag === 'shouted' ? '!' : '.');
  const quoted = words ? '<span class="q">"' + esc(words) + end + '"</span>' : '<span class="q">"…"</span>';
  return who + ' ' + esc(tag) + ', ' + quoted;
}
function setDlgWho(i, who) { if (S.story.sentences[i].locked) return; S.story.sentences[i].dlg.who = who; renderStory(); debounceSave(); }
function setDlgTag(i, tag) { if (S.story.sentences[i].locked) return; S.story.sentences[i].dlg.tag = tag; renderStory(); debounceSave(); }
function onDlgWords(i) {
  const input = document.getElementById('dlg-words-' + i);
  if (!input) return;
  const d = S.story.sentences[i].dlg;
  d.words = input.value;
  const prev = document.getElementById('dlg-preview-' + i);
  if (prev) prev.innerHTML = dlgPreviewHTML(d);
  const useBtn = document.getElementById('dlg-use-' + i);
  if (useBtn) useBtn.disabled = !canAssemble(d);
  debounceSave();
}
function useDialogue(i) {
  const sent = S.story.sentences[i];
  if (sent.locked) return;
  if (!canAssemble(sent.dlg)) { toast('Pick who is talking and type their words first', 'warning'); return; }
  sent.text = assembleDialogue(sent.dlg);
  sent.sourceCheck = null; sent.proofed = false; sent.proofIdx = 0; sent.homo = {};
  renderStory();
  debounceSave();

}

function onStoryText(i) {
  const ta = document.getElementById('story-text-' + i);
  if (!ta) return;
  const sent = S.story.sentences[i];
  const prevHadText = !!(sent.text && sent.text.trim());
  const prevSourceCheck = sent.sourceCheck;
  const prevProofed = sent.proofed;
  sent.text = ta.value;
  const nowHasText = !!ta.value.trim();
  if (prevSourceCheck === 'match') sent.sourceCheck = null;
  // editing invalidates a prior proofread + sound-alike check
  sent.proofed = false; sent.proofIdx = 0; sent.homo = {};
  const visibilityChanged = (prevHadText !== nowHasText);
  const matchInvalidated = (prevSourceCheck === 'match') || prevProofed;
  if (visibilityChanged || matchInvalidated) {
    const wasFocused = (document.activeElement === ta);
    const selStart = wasFocused ? ta.selectionStart : null;
    const selEnd = wasFocused ? ta.selectionEnd : null;
    renderStory();
    if (wasFocused) {
      const ta2 = document.getElementById('story-text-' + i);

    }

  debounceSave();
}
function setSourceCheck(i, check) {
  if (S.story.sentences[i].locked) return;
  S.story.sentences[i].sourceCheck = check;
  if (check === 'unmatch') toast('Look at your drawing again — what does it really show?', 'warning');
  if (check === 'match') { S.story.sentences[i].proofIdx = 0; S.story.sentences[i].proofed = false; S.story.sentences[i].homo = {}; }
  renderStory();
  debounceSave();
}
function lockStorySentence(i) {
  const sent = S.story.sentences[i];
  if (!sent.text.trim() || sent.sourceCheck !== 'match' || !sent.proofed || !homoPass(sent)) return;
  sent.locked = true;
  S.timestamps['s' + (i+1) + 'Locked'] = new Date().toISOString();
  postToSheets('Activity Log', [SESSION_DATE, 'Marcello', 'Summer story sentence ' + (i+1) + ' locked (' + sent.mode + ')', 'Writing', 'Locked', '', '', 'Mode: ' + sent.mode + ' | sound-alikes: ' + homoHits(sent).length + ' | ' + sent.text.slice(0, 140)]);
  toast('Sentence ' + (i+1) + ' locked! 🎉');
  fireCelebration();
  renderStory();
  debounceSave();
}
function unlockStorySentence(i) { S.story.sentences[i].locked = false; renderStory(); debounceSave(); }
function finishStory() {
  S.story.done = true;
  S.timestamps.storyEnd = new Date().toISOString();
  postToSheets('Activity Log', [SESSION_DATE, 'Marcello', 'Summer story complete', 'Writing', 'Done', '', '', 'Locked: ' + S.story.sentences.filter(function(s){return s.locked;}).length + '/3 | Label: ' + (S.story.label || '-') + ' | Topic: ' + (S.welcome.topic || '-')]);
  toast('Summer story done! 🍂');
  fireCelebration();
  saveImmediate();

function onStoryLabel() { const el = document.getElementById('storyLabel'); if (el) { S.story.label = el.value; debounceSave(); } }

// === Drawing toolbar (Draw/Erase + 5 colors) — zero-dependency white-brush eraser ===
const PENCIL_W = 3, ERASER_W = 18;
let storyTool = { mode: 'draw', color: '#1a1a1a' };
function applyStroke(ctx) {
  ctx.globalCompositeOperation = 'source-over';
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (storyTool.mode === 'erase') { ctx.strokeStyle = ctx.fillStyle = '#ffffff'; ctx.lineWidth = ERASER_W; }
  else { ctx.strokeStyle = ctx.fillStyle = storyTool.color; ctx.lineWidth = PENCIL_W; }
}
function setTool(mode) { storyTool.mode = mode; syncTools(); }
function setColor(hex) { storyTool.color = hex; storyTool.mode = 'draw'; syncTools(); }
function syncTools() {
  const root = document.getElementById('storyTools'); if (!root) return;
  root.querySelectorAll('.mode-btn').forEach(function(b) { b.classList.toggle('active', b.dataset.mode === storyTool.mode); });
  root.querySelectorAll('.swatch').forEach(function(b) { b.classList.toggle('active', storyTool.mode === 'draw' && b.getAttribute('style').indexOf(storyTool.color) !== -1); });
}

// === Story canvas (single panel) ===
function setupStoryCanvas() {
  const canvas = document.getElementById('storyCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  if (S.story.panel) { const img = new Image(); img.onload = function() { ctx.drawImage(img, 0, 0, canvas.width, canvas.height); }; img.src = S.story.panel; }
  syncTools();
  let drawing = false, lastX = 0, lastY = 0, dirty = false;
  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const point = e.touches && e.touches[0] ? e.touches[0] : e;
    return { x: (point.clientX - rect.left) * (canvas.width / rect.width), y: (point.clientY - rect.top) * (canvas.height / rect.height) };
  }
  function start(e) { e.preventDefault(); drawing = true; applyStroke(ctx); const p = getPos(e); lastX = p.x; lastY = p.y; ctx.beginPath(); ctx.arc(p.x, p.y, (storyTool.mode === 'erase' ? ERASER_W/2 : 1.5), 0, Math.PI*2); ctx.fill(); dirty = true; }
  function move(e) { if (!drawing) return; e.preventDefault(); const p = getPos(e); ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(p.x, p.y); ctx.stroke(); lastX = p.x; lastY = p.y; dirty = true; }
  function end() { if (drawing && dirty) { drawing = false; try { S.story.panel = canvas.toDataURL('image/jpeg', 0.6); } catch(e) {} dirty = false; debounceSave(); } drawing = false; }
  canvas.addEventListener('mousedown', start); canvas.addEventListener('mousemove', move); canvas.addEventListener('mouseup', end); canvas.addEventListener('mouseleave', end);
  canvas.addEventListener('touchstart', start, { passive: false }); canvas.addEventListener('touchmove', move, { passive: false }); canvas.addEventListener('touchend', end); canvas.addEventListener('touchcancel', end);
}
function clearStoryCanvas() {
  const canvas = document.getElementById('storyCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  S.story.panel = null; debounceSave();
}

// === MIC / Speech-to-Text (iOS Safari: interimResults MUST be true) ===
let recog = null, activeMicIdx = null;
function toggleMic(idx) {
  if (S.story.sentences[idx].locked) { toast('Unlock the sentence to use the mic', 'warning'); return; }
  if (!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) { toast('Speech-to-text not available — type instead', 'warning'); return; }
  if (recog && activeMicIdx === idx) { try { recog.stop(); } catch(e) {} return; }
  if (recog) try { recog.stop(); } catch(e) {}
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recog = new SR();
  recog.continuous = false; recog.interimResults = true; recog.lang = 'en-US';
  activeMicIdx = idx;
  const starting = S.story.sentences[idx].text || '';
  const needsSpace = starting && !/\s$/.test(starting);
  const prefix = starting + (needsSpace ? ' ' : '');
  const btn = document.getElementById('mic-' + idx);
  if (btn) { btn.classList.add('recording'); btn.textContent = '⏸'; }
  recog.onresult = function(e) {
    let interim = '', finalT = '';
    for (let i = 0; i < e.results.length; i++) { const piece = e.results[i][0].transcript; if (e.results[i].isFinal) finalT += piece; else interim += piece; }
    const transcript = (finalT + interim).trim();
    if (!transcript) return;
    const newText = prefix + transcript;
    S.story.sentences[idx].text = newText;
    if (S.story.sentences[idx].sourceCheck === 'match') S.story.sentences[idx].sourceCheck = null;
    S.story.sentences[idx].proofed = false; S.story.sentences[idx].proofIdx = 0; S.story.sentences[idx].homo = {};
    const ta = document.getElementById('story-text-' + idx);
    if (ta) ta.value = newText;
  };
  recog.onerror = function(e) {
    const err = (e && e.error) || 'unknown';
    stopMic();
    toast(err === 'not-allowed' ? 'Mic blocked — allow microphone in Safari settings, then try again' : 'Mic error: ' + err + ' — try typing', 'warning');
  };
  recog.onend = function() { stopMic(); renderStory(); debounceSave(); };
  try { recog.start(); toast('🎤 Listening... tap mic again to stop'); }
  catch(e) { stopMic(); toast('Mic could not start', 'warning'); }
}
function stopMic() {
  if (activeMicIdx !== null) { const btn = document.getElementById('mic-' + activeMicIdx); if (btn) { btn.classList.remove('recording'); btn.textContent = '🎤'; } }
  recog = null; activeMicIdx = null;
}

// ============================================================
//  TAB 5 — WRAP-UP (Stars & a Wish + 4th-grade info for the tutor)
// ============================================================
function renderWrap() {
  const el = document.getElementById('card-wrap');
  const w = S.wrap;
  const hasWish = (w.wish || []).length > 0 || (w.wishCustom || '').trim();

  let html =
    '<div class="card">' +
    (w.done ? '<div class="review-banner">✅ Session complete. Welcome to 4th grade, Marcello!</div>' : '') +
    '<h2>⭐ Stars &amp; a Wish</h2>' +
    '<p class="directions">Tap a star for everything you did today. Then pick ONE wish — something you want to get better at this year.</p>' +
    '<div class="stars-row">';
  STARS.forEach(function(label, i) {
    const on = w.stars.indexOf(i) !== -1;
    html += '<button class="star-btn ' + (on ? 'active' : '') + '" onclick="toggleStar(' + i + ')">' + (on ? '⭐ ' : '☆ ') + esc(label) + '</button>';
  });
  html += '</div></div>';

  html += '<div class="card"><h2>🌠 My 4th-grade wish</h2><div class="stars-row">';
  WISHES.forEach(function(g) {
    const on = w.wish.indexOf(g) !== -1;
    html += '<button class="wish-chip ' + (on ? 'active' : '') + '" onclick="toggleWish(' + attr(g) + ')">' + (on ? '✓ ' : '') + esc(g) + '</button>';
  });
  html += '</div><input class="label-input" style="max-width:none;margin-top:10px;" id="wishCustom" placeholder="…or write your own wish" oninput="onWishCustom()" value="' + esc(w.wishCustom) + '"></div>';

  // Tutor: capture what 4th grade looks like (no newsletter yet)
  html += '<div class="card"><h2><span class="tutor-tag">Tutor</span> 4th-grade intel</h2>' +
    '<p class="directions">No newsletter yet this year — capture what Marcello (or his parents) can tell you, so next week’s session can align to class.</p>' +
    '<div class="tutor-notes">' +
    '<label>Teacher</label><input id="tn-teacher" value="' + esc(w.tutor.teacher) + '" oninput="onTutorNote(\'teacher\')" placeholder="name">' +
    '<label>Reading — what’s the class reading / working on?</label><input id="tn-reading" value="' + esc(w.tutor.reading) + '" oninput="onTutorNote(\'reading\')" placeholder="book / unit / skill">' +
    '<label>Writing — what kind of writing?</label><input id="tn-writing" value="' + esc(w.tutor.writing) + '" oninput="onTutorNote(\'writing\')" placeholder="narrative / opinion / informational…">' +
    '<label>Math — module / topic</label><input id="tn-math" value="' + esc(w.tutor.math) + '" oninput="onTutorNote(\'math\')" placeholder="e.g., Eureka Module 1 place value">' +
    '<label>Where does class info come from this year? (newsletter, app, email…)</label><input id="tn-info" value="' + esc(w.tutor.info) + '" oninput="onTutorNote(\'info\')" placeholder="ask the parents">' +
    '<label>Other notes</label><textarea id="tn-notes" oninput="onTutorNote(\'notes\')" placeholder="energy, anything he said unprompted, what to change next week…">' + esc(w.tutor.notes) + '</textarea>' +
    '</div></div>';

  html += '<div class="card">' +
    '<div class="pep-banner">' +
    '<div style="font-size:2.6rem;margin-bottom:6px;">🎒🍂</div>' +
    '<h3>Welcome to 4th grade, Marcello!</h3>' +
    '<p>You came back a stronger reader and writer than you left. This year we keep going — bigger words, longer stories, and catching those sneaky sound-alike words. I’m glad you’re back. 🌟</p>' +
    '</div>' +
    '<div class="btn-row"><button class="btn btn-orange" onclick="finishWrap()" ' + (hasWish && w.stars.length ? '' : 'disabled') + '>' + (w.done ? '✓ All done!' : 'Finish — 4th grade, here I come! 🎉') + '</button></div>' +
    (hasWish && w.stars.length ? '' : '<p style="text-align:center;font-size:0.83rem;color:var(--muted);font-style:italic;margin-top:6px;">Tap at least one star and pick a wish.</p>') +
    '</div>';

  el.innerHTML = html;
}
function toggleStar(i) {
  const idx = S.wrap.stars.indexOf(i);
  if (idx !== -1) S.wrap.stars.splice(idx, 1); else S.wrap.stars.push(i);
  renderWrap(); debounceSave();
}
function toggleWish(g) {
  const idx = S.wrap.wish.indexOf(g);
  if (idx !== -1) S.wrap.wish.splice(idx, 1); else S.wrap.wish.push(g);
  renderWrap(); debounceSave();
}
function onWishCustom() {
  const el = document.getElementById('wishCustom'); if (!el) return;
  S.wrap.wishCustom = el.value;
  const btn = document.querySelector('#card-wrap .btn-orange');
  const hasWish = S.wrap.wish.length > 0 || S.wrap.wishCustom.trim();
  if (btn) btn.disabled = !(hasWish && S.wrap.stars.length);
  debounceSave();
}
function onTutorNote(key) {
  const el = document.getElementById('tn-' + key); if (!el) return;
  S.wrap.tutor[key] = el.value; debounceSave();
}
function finishWrap() {
  S.wrap.done = true;
  S.timestamps.sessionEnd = new Date().toISOString();
  const wish = S.wrap.wish.concat(S.wrap.wishCustom.trim() ? [S.wrap.wishCustom.trim()] : []).join('; ');
  const t = S.wrap.tutor;
  postToSheets('Activity Log', [SESSION_DATE, 'Marcello', 'Session Complete — Welcome Back to 4th Grade', 'Wrap-up', 'Done', '', '',
    'Stars: ' + S.wrap.stars.length + ' | Wish: ' + (wish || '-') + ' | Teacher: ' + (t.teacher || '-') + ' | Reading: ' + (t.reading || '-') + ' | Writing: ' + (t.writing || '-') + ' | Math: ' + (t.math || '-') + ' | Info source: ' + (t.info || '-')]);
  toast('Welcome to 4th grade! 🎉🍂');
  fireCelebration();
  setTimeout(fireCelebration, 600);
  saveImmediate();
  updateTabBadges();
  renderWrap();
}

// ============================================================
//  INIT
// ============================================================
async function init() {
  const cloudState = await loadStateFromCloud(CLOUD_STATE_KEY);
  if (cloudState && cloudState.timestamps) {
    S = Object.assign(freshState(), cloudState);
    lastCloudJSON = JSON.stringify(cloudState);
    backfill();
    toast('Loaded from cloud ☁️');
  } else if (!VIEW_ONLY && loadFromLocalStorage()) {
    backfill();
    toast('Loaded local save');
  }
  if (S.wrap && S.wrap.done) switchTab('wrap');
  else if (S.story && S.story.done) switchTab('wrap');
  else if (S.detective && S.detective.done) switchTab('story');
  else if (S.reading && S.reading.done) switchTab('detective');
  else if (S.welcome && S.welcome.done) switchTab('reading');
  else { renderWelcome(); updateTabBadges(); }
  if (VIEW_ONLY) {
    document.getElementById('saveIndicator').textContent = '👀 View-only mirror — syncing from cloud';
    const rb = document.querySelector('.tutor-reset'); if (rb) rb.style.display = 'none';
    setInterval(pollCloud, 10000);
  } else {
    setInterval(function() { if (dirty) saveStateToCloud(); }, 30000);   // only a tab with unsaved changes writes — a passive second tab never clobbers
  }
}
let lastCloudJSON = null;
async function pollCloud() {
  const cs = await loadStateFromCloud(CLOUD_STATE_KEY);
  if (!cs || !cs.timestamps) return;
  const j = JSON.stringify(cs);
  if (j === lastCloudJSON) return;
  lastCloudJSON = j;
  S = Object.assign(freshState(), cs);
  backfill();
  const ind = document.getElementById('saveIndicator');
  ind.textContent = '👀 Mirror updated ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  if (activeTab === 'welcome') renderWelcome();
  else if (activeTab === 'reading') renderReading();
  else if (activeTab === 'detective') renderDetective();
  else if (activeTab === 'story') renderStory();
  else if (activeTab === 'wrap') renderWrap();
  updateTabBadges();
}
function backfill() {
  const f = freshState();
  if (!S.welcome) S.welcome = f.welcome;
  if (!S.reading) S.reading = f.reading;
  if (!S.detective) S.detective = f.detective;
  if (!S.detective.cases) S.detective.cases = [];
  if (!S.detective.rulesSeen) S.detective.rulesSeen = f.detective.rulesSeen;
  if (!S.story) S.story = f.story;
  if (!S.story.sentences || S.story.sentences.length < 3) S.story.sentences = f.story.sentences;
  S.story.sentences.forEach(function(s, i) {
    if (!s.mode) s.mode = ['narrative', 'dialogue', 'feeling'][i] || 'narrative';
    if (s.mode === 'dialogue' && !s.dlg) s.dlg = { who: '', tag: 'said', words: '' };
    if (typeof s.proofIdx !== 'number') s.proofIdx = 0;
    if (typeof s.proofed !== 'boolean') s.proofed = false;
    if (!s.homo) s.homo = {};
  });
  if (!S.wrap) S.wrap = f.wrap;
  if (!S.wrap.tutor) S.wrap.tutor = f.wrap.tutor;
  if (!S.timestamps) S.timestamps = {};
}
init();
</script>
