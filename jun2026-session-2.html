<style>

  .write-card { background: white; border: 2px solid #E0E0E0; border-radius: 16px; padding: 18px 20px; margin-bottom: 16px; transition: all 0.25s; }

  .prompt-line { font-size: 0.95rem; font-weight: 700; color: var(--text); margin-bottom: 10px; line-height: 1.5; }

  .dlg-builder { background: var(--gold-light); border: 2px solid var(--gold); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }

  .dlg-chant-label { font-size: 0.66rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; color: var(--orange); }

  .dlg-chant-spk { margin-left: auto; font-size: 1.15rem; }

  .dlg-chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .dlg-chip { padding: 8px 16px; border-radius: 20px; font-size: 0.9rem; font-weight: 700; border: 2px solid #E0C97A; background: white; color: #8D6E13; cursor: pointer; font-family: 'Nunito', sans-serif; transition: all 0.2s; }

  .dlg-hint { font-size: 0.8rem; color: #8D6E13; margin-top: 8px; line-height: 1.4; }

  .write-textarea-wrap { position: relative; }
  .write-textarea { width: 100%; min-height: 80px; border: 2px solid #D0D5DD; border-radius: 12px; padding: 14px 50px 14px 14px; font-family: 'Nunito', sans-serif; font-size: 1rem; font-weight: 600; resize: vertical; line-height: 1.6; background: #FAFBFC; }

  .mic-btn { position: absolute; top: 10px; right: 10px; width: 36px; height: 36px; border-radius: 50%; background: var(--orange-light); border: 2px solid var(--orange); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1rem; transition: all 0.2s; }
  .mic-btn:hover { background: var(--orange); color: white; }

  .source-btn { flex: 1; padding: 10px; border-radius: 10px; font-weight: 700; font-size: 0.85rem; border: 2px solid; cursor: pointer; font-family: 'Nunito', sans-serif; transition: all 0.2s; }

function freshState() {

function toast(msg, kind) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (kind ? ' ' + kind : '');
  setTimeout(function() { t.className = 'toast'; }, 3000);
}
function esc(text) { const d = document.createElement('div'); d.textContent = text || ''; return d.innerHTML; }

function saveToLocalStorage() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(S));
    const ind = document.getElementById('saveIndicator');
    ind.textContent = 'Saved ✓';
    ind.classList.add('flash');
    setTimeout(function() { ind.classList.remove('flash'); }, 1000);
  } catch(e) {
    if (e.name === 'QuotaExceededError') toast('Local save full — drawing may be too large', 'warning');
  }
}
function loadFromLocalStorage() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    const loaded = JSON.parse(raw);
    S = Object.assign(freshState(), loaded);
    return true;
  } catch(e) { return false; }
}

let saveDebounce = null, cloudDebounce = null;
let cloudFireDeadline = null;
function debounceSave() {
  clearTimeout(saveDebounce);
  saveDebounce = setTimeout(saveToLocalStorage, 500);
  const now = Date.now();
  if (cloudFireDeadline === null) cloudFireDeadline = now + 8000;
  const remaining = Math.max(cloudFireDeadline - now, 0);
  const fireIn = Math.min(3500, remaining);
  clearTimeout(cloudDebounce);
  cloudDebounce = setTimeout(function() { cloudFireDeadline = null; saveStateToCloud(); }, fireIn);
}
function saveImmediate() {
  clearTimeout(saveDebounce);
  clearTimeout(cloudDebounce);
  cloudFireDeadline = null;
  saveToLocalStorage();
  saveStateToCloud();
}
function postToSheets(sheet, row) {
  try {
    fetch(TRACKER_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ sheet: sheet, row: row }) });
  } catch(e) {}
}
function saveStateToCloud() {
  try {
    fetch(TRACKER_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ sheet: 'Session State', key: CLOUD_STATE_KEY, state: S }) });
    const ind = document.getElementById('saveIndicator');
    ind.textContent = 'Cloud saved ☁️';
    ind.classList.add('flash');
    setTimeout(function() { ind.classList.remove('flash'); }, 1000);
  } catch(e) {}
}
function loadStateFromCloud(key) {
  return new Promise(function(resolve) {
    const cbName = 'cloudCB_' + Date.now() + '_' + Math.random().toString(36).slice(2);
    const timeout = setTimeout(function() { delete window[cbName]; resolve(null); }, 8000);
    window[cbName] = function(result) {
      clearTimeout(timeout); delete window[cbName];
      if (result && result.success && result.state) resolve(result.state); else resolve(null);
    };
    const script = document.createElement('script');
    script.src = TRACKER_URL + '?action=loadState&key=' + encodeURIComponent(key) + '&callback=' + cbName;
    script.onerror = function() { clearTimeout(timeout); delete window[cbName]; resolve(null); };
    document.head.appendChild(script);
  });
}

let speechUnlocked = false;
function unlockSpeech() {
  if (speechUnlocked || !('speechSynthesis' in window)) return;
  const dummy = new SpeechSynthesisUtterance(''); dummy.volume = 0;
  window.speechSynthesis.speak(dummy); speechUnlocked = true;
}
document.addEventListener('touchstart', unlockSpeech, { once: true });
document.addEventListener('click', unlockSpeech, { once: true });
function speakText(text, rate) {
  if (!('speechSynthesis' in window)) { toast('Speech not available', 'warning'); return; }
  window.speechSynthesis.cancel();
  setTimeout(function() {
    const u = new SpeechSynthesisUtterance(text);
    u.rate = rate || 0.85; u.pitch = 1;
    u.onerror = function() { toast('Speech error — tap again', 'warning'); };
    window.speechSynthesis.speak(u);
  }, 100);
}

function buildStorySentence(i, sent) {
  const isLocked = sent.locked;
  const isDialogue = sent.mode === 'dialogue';
  const text = sent.text || '';
  const prompt = isDialogue
    ? 'Make someone TALK about your summer. What would you say? What might a friend or your mom or dad say?'
    : 'Tell what you want to do this summer.';

  let html = '<div class="write-card ' + (isDialogue ? 'dialogue ' : '') + (isLocked ? 'locked' : '') + '">' +
    '<div class="write-card-header">' +
    '<div class="write-card-title ' + (isDialogue ? 'dialogue ' : '') + (isLocked ? 'locked' : '') + '">' + (isLocked ? '✓ ' : '') + 'Sentence ' + (i+1) + '</div>' +
    '<span class="write-badge ' + (isDialogue ? 'dlg' : 'narr') + '">' + (isDialogue ? '🗣️ Talking sentence' : '📝 Tell what happens') + '</span>' +
    '</div>' +
    '<div class="prompt-line">' + esc(prompt) + '</div>';

  if (isDialogue && !isLocked) html += buildDialogueBuilder(i, sent);

  const placeholder = isDialogue ? 'Build your talking sentence above, then fix it here if you need to…' : 'Write your sentence here… (or tap 🎤 and say it)';
  html += '<div class="write-textarea-wrap">' +
    '<textarea class="write-textarea ' + (isLocked ? 'locked' : '') + '" id="story-text-' + i + '" placeholder="' + placeholder + '" oninput="onStoryText(' + i + ')" ' + (isLocked ? 'readonly' : '') + '>' + esc(text) + '</textarea>' +
    '<button class="mic-btn" id="mic-' + i + '" onclick="toggleMic(' + i + ')" title="Speak → text drops in">🎤</button>' +
    '</div>';

  // Source check (against the drawing)
  if (text.trim() && !isLocked) {
    const cls = sent.sourceCheck === 'match' ? 'matched' : (sent.sourceCheck === 'unmatch' ? 'unmatched' : '');
    const sprompt = isDialogue
      ? '🔍 <strong>Two checks.</strong> (1) Does your sentence go with your drawing? (2) Do the quotation marks " " hug the EXACT words someone says?'
      : '🔍 <strong>Check.</strong> Look at your drawing. Look at your sentence. Do they tell the same thing?';
    html += '<div class="source-check ' + cls + '">' +
      '<div class="source-check-prompt">' + sprompt + '</div>' +
      '<div class="source-check-row">' +
      '<button class="source-btn match ' + (sent.sourceCheck === 'match' ? 'active' : '') + '" onclick="setSourceCheck(' + i + ',\'match\')">✓ Yes — they match</button>' +
      '<button class="source-btn unmatch ' + (sent.sourceCheck === 'unmatch' ? 'active' : '') + '" onclick="setSourceCheck(' + i + ',\'unmatch\')">✗ Not yet — let me look again</button>' +
      '</div></div>';
  }

  // NEW — finger-point word-by-word proofread (shows once source-check matches)
  if (text.trim() && !isLocked && sent.sourceCheck === 'match') {
    html += buildProofread(i, sent);
  }

  // Lock row
  if (!isLocked) {
    const canLock = text.trim() && sent.sourceCheck === 'match' && sent.proofed;
    html += '<div class="lock-row"><button class="lock-btn" onclick="lockStorySentence(' + i + ')" ' + (canLock ? '' : 'disabled') + '>🔒 Lock sentence ' + (i+1) + '</button></div>';
  } else {
    html += '<div class="lock-row"><button class="unlock-btn" onclick="unlockStorySentence(' + i + ')">✏️ Edit again</button></div>';
  }

  html += '</div>';
  return html;
}

// === NEW finger-point proofread ===
function proofWords(sent) { return (sent.text || '').trim().split(/\s+/).filter(function(w) { return w.length; }); }
function buildProofread(i, sent) {
  const words = proofWords(sent);
  const idx = sent.proofIdx || 0;
  const done = sent.proofed;
  let html = '<div class="proof-box ' + (done ? 'done' : '') + '">' +
    '<div class="proof-title">' + (done ? '✓ You read every word!' : '👆 Now check it word by word') + '</div>' +
    '<div class="proof-sub">' + (done
      ? 'You touched each word and read the REAL word on the page. That’s how you catch mistakes.'
      : 'Touch the glowing word and read ONLY that word out loud — slowly. Read what is REALLY there, not what you meant to write.') + '</div>' +
    '<div class="proof-words">';
  words.forEach(function(w, wi) {
    let cls = 'proof-word';
    if (wi < idx) cls += ' read';
    else if (wi === idx && !done) cls += ' next';
    html += '<span class="' + cls + '" ' + (wi === idx && !done ? 'onclick="proofTap(' + i + ')"' : '') + '>' + esc(w) + '</span>';
  });
  html += '</div>';
  if (!done) html += '<div class="proof-progress">' + idx + ' of ' + words.length + ' words read</div>' +
    '<div class="btn-row" style="justify-content:flex-start;margin-top:10px;"><button class="btn btn-sm btn-secondary" onclick="proofReset(' + i + ')">↻ Start over</button></div>';
  html += '</div>';
  return html;
}
function proofTap(i) {
  const sent = S.story.sentences[i];
  const words = proofWords(sent);
  const word = words[sent.proofIdx];
  if (word) speakText(word.replace(/[.,!?"']/g, ''), 0.6);
  sent.proofIdx = (sent.proofIdx || 0) + 1;
  if (sent.proofIdx >= words.length) {
    sent.proofed = true;
    toast('You read every word! 👀✓');
    postToSheets('Activity Log', [SESSION_DATE, 'Marcello', 'Finger-point proofread (sentence ' + (i+1) + ')', 'Writing - Self-Monitoring', words.length, words.length, '100%', 'Read each word aloud one at a time: ' + sent.text.slice(0,120)]);
  }
  renderStory();
  debounceSave();
}
function proofReset(i) {
  S.story.sentences[i].proofIdx = 0;
  S.story.sentences[i].proofed = false;
  renderStory();
  debounceSave();
}

// === Dialogue builder (W.3.3.b) — same engine as prior weeks ===
function buildDialogueBuilder(i, sent) {
  const d = sent.dlg || { who: '', tag: 'said', words: '' };
  let html = '<div class="dlg-builder">' +
    '<div class="dlg-builder-title">🗣️ Build a talking sentence (dialogue)</div>' +
    '<div class="dlg-builder-sub">When someone TALKS, put their exact words inside quotation marks " ". Build it one piece at a time.</div>' +
    '<div class="dlg-chant" onclick="speakText(\'Who is talking? What did they say? Hug the words.\', 0.9)" title="Say it out loud together — then tap to hear it.">' +
      '<span class="dlg-chant-label">📣 Say it<br>with me</span>' +
      '<span class="dlg-chant-words">"Who\'s talking? · What did they say? · Hug the words."</span>' +
      '<span class="dlg-chant-spk">🔊</span>' +
    '</div>';
  html += '<div class="dlg-step-label">1 · Who is talking?</div><div class="dlg-chips">';
  DLG_WHO.forEach(function(who) {
    const label = who === 'I' ? 'I (me)' : who;
    html += '<button class="dlg-chip ' + (d.who === who ? 'active' : '') + '" onclick="setDlgWho(' + i + ',' + JSON.stringify(who).replace(/"/g,'&quot;') + ')">' + esc(label) + '</button>';
  });
  html += '</div>';
  html += '<div class="dlg-step-label">2 · What did they say? (the exact words)</div>' +
    '<input class="dlg-words-input" id="dlg-words-' + i + '" placeholder="e.g., This is going to be the best summer" oninput="onDlgWords(' + i + ')" value="' + esc(d.words) + '">';
  html += '<div class="dlg-step-label">3 · Tell-word</div><div class="dlg-chips">';
  DLG_TAGS.forEach(function(tag) {
    html += '<button class="dlg-chip ' + (d.tag === tag ? 'active' : '') + '" onclick="setDlgTag(' + i + ',\'' + tag + '\')">' + tag + '</button>';
  });
  html += '</div>';
  html += '<div class="dlg-preview" id="dlg-preview-' + i + '">' + dlgPreviewHTML(d) + '</div>';
  html += '<div class="dlg-hint">💡 The quotation marks " " always hug the EXACT words. The tell-word (said / asked) tells the reader WHO is talking.</div>';
  html += '<div class="dlg-use-row"><button class="btn btn-gold btn-sm" id="dlg-use-' + i + '" onclick="useDialogue(' + i + ')" ' + (canAssemble(d) ? '' : 'disabled') + '>⬇️ Put it in the box</button></div>';
  html += '</div>';
  return html;
}
function canAssemble(d) { return d && d.who && d.tag && d.words && d.words.trim().length > 0; }
function assembleDialogue(d) {
  const who = d.who || '____';
  const tag = d.tag || 'said';
  let words = (d.words || '').trim().replace(/[.?!]+$/, '');
  if (words.length) words = words.charAt(0).toUpperCase() + words.slice(1);
  const end = tag === 'asked' ? '?' : '.';
  return who + ' ' + tag + ', "' + words + end + '"';
}
function dlgPreviewHTML(d) {
  if (!d || (!d.who && !d.words)) return '<span style="color:var(--muted);font-weight:600;">Your talking sentence will appear here as you build it…</span>';
  const who = d.who ? '<span class="who">' + esc(d.who) + '</span>' : '<span style="color:var(--muted);">____</span>';
  const tag = d.tag || 'said';
  let words = (d.words || '').trim().replace(/[.?!]+$/, '');
  if (words.length) words = words.charAt(0).toUpperCase() + words.slice(1);
  const end = tag === 'asked' ? '?' : '.';
  const quoted = words ? '<span class="q">"' + esc(words) + end + '"</span>' : '<span class="q">"…"</span>';
  return who + ' ' + esc(tag) + ', ' + quoted;
}
function setDlgWho(i, who) { if (S.story.sentences[i].locked) return; S.story.sentences[i].dlg.who = who; renderStory(); debounceSave(); }
function setDlgTag(i, tag) { if (S.story.sentences[i].locked) return; S.story.sentences[i].dlg.tag = tag; renderStory(); debounceSave(); }
function onDlgWords(i) {
  const input = document.getElementById('dlg-words-' + i);
  if (!input) return;
  const d = S.story.sentences[i].dlg;
  d.words = input.value;
  const prev = document.getElementById('dlg-preview-' + i);
  if (prev) prev.innerHTML = dlgPreviewHTML(d);
  const useBtn = document.getElementById('dlg-use-' + i);
  if (useBtn) useBtn.disabled = !canAssemble(d);
  debounceSave();
}
function useDialogue(i) {
  const sent = S.story.sentences[i];
  if (sent.locked) return;
  if (!canAssemble(sent.dlg)) { toast('Pick who is talking and type their words first', 'warning'); return; }
  sent.text = assembleDialogue(sent.dlg);
  sent.sourceCheck = null; sent.proofed = false; sent.proofIdx = 0;
  renderStory();
  debounceSave();
  toast('Dropped it in the box — now read it aloud and check it 🔍');
}

function onStoryText(i) {
  const ta = document.getElementById('story-text-' + i);
  if (!ta) return;
  const sent = S.story.sentences[i];
  const prevHadText = !!(sent.text && sent.text.trim());
  const prevSourceCheck = sent.sourceCheck;
  const prevProofed = sent.proofed;
  sent.text = ta.value;
  const nowHasText = !!ta.value.trim();
  if (prevSourceCheck === 'match') sent.sourceCheck = null;
  // editing invalidates a prior proofread
  sent.proofed = false; sent.proofIdx = 0;
  const visibilityChanged = (prevHadText !== nowHasText);
  const matchInvalidated = (prevSourceCheck === 'match') || prevProofed;
  if (visibilityChanged || matchInvalidated) {
    const wasFocused = (document.activeElement === ta);
    const selStart = wasFocused ? ta.selectionStart : null;
    const selEnd = wasFocused ? ta.selectionEnd : null;
    renderStory();
    if (wasFocused) {
      const ta2 = document.getElementById('story-text-' + i);
      if (ta2) { ta2.focus(); try { ta2.setSelectionRange(selStart, selEnd); } catch(e) {} }
    }
  }
  debounceSave();
}
function setSourceCheck(i, check) {
  if (S.story.sentences[i].locked) return;
  S.story.sentences[i].sourceCheck = check;
  if (check === 'unmatch') toast('Look at your drawing again — what does it really show?', 'warning');
  if (check === 'match') { S.story.sentences[i].proofIdx = 0; S.story.sentences[i].proofed = false; }
  renderStory();
  debounceSave();
}
function lockStorySentence(i) {
  const sent = S.story.sentences[i];
  if (!sent.text.trim() || sent.sourceCheck !== 'match' || !sent.proofed) return;
  sent.locked = true;
  S.timestamps['s' + (i+1) + 'Locked'] = new Date().toISOString();
  postToSheets('Activity Log', [SESSION_DATE, 'Marcello', 'Summer story sentence ' + (i+1) + ' locked' + (sent.mode === 'dialogue' ? ' (dialogue)' : ''), 'Writing', 'Locked', '', '', 'Mode: ' + sent.mode + ' | ' + sent.text.slice(0, 140)]);
  toast('Sentence ' + (i+1) + ' locked! 🎉');
  fireCelebration();
  renderStory();
  debounceSave();
}
function unlockStorySentence(i) { S.story.sentences[i].locked = false; renderStory(); debounceSave(); }
function finishStory() {
  S.story.done = true;
  postToSheets('Activity Log', [SESSION_DATE, 'Marcello', 'Summer story complete', 'Writing', 'Done', '', '', 'Locked: ' + S.story.sentences.filter(function(s){return s.locked;}).length + '/2 | Label: ' + (S.story.label || '-')]);
  toast('Summer story done! 🏖️');
  fireCelebration();
  saveImmediate();
  updateTabBadges();
  switchTab('plan');
}

function onStoryLabel() { const el = document.getElementById('storyLabel'); if (el) { S.story.label = el.value; debounceSave(); } }

// === Story canvas (single panel) ===
function setupStoryCanvas() {
  const canvas = document.getElementById('storyCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#1a1a1a';
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  if (S.story.panel) { const img = new Image(); img.onload = function() { ctx.drawImage(img, 0, 0, canvas.width, canvas.height); }; img.src = S.story.panel; }
  let drawing = false, lastX = 0, lastY = 0, dirty = false;
  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const point = e.touches && e.touches[0] ? e.touches[0] : e;
    return { x: (point.clientX - rect.left) * (canvas.width / rect.width), y: (point.clientY - rect.top) * (canvas.height / rect.height) };
  }
  function start(e) { e.preventDefault(); drawing = true; const p = getPos(e); lastX = p.x; lastY = p.y; ctx.beginPath(); ctx.arc(p.x, p.y, 1.5, 0, Math.PI*2); ctx.fill(); dirty = true; }
  function move(e) { if (!drawing) return; e.preventDefault(); const p = getPos(e); ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(p.x, p.y); ctx.stroke(); lastX = p.x; lastY = p.y; dirty = true; }
  function end() { if (drawing && dirty) { drawing = false; try { S.story.panel = canvas.toDataURL('image/jpeg', 0.6); } catch(e) {} dirty = false; debounceSave(); } drawing = false; }
  canvas.addEventListener('mousedown', start); canvas.addEventListener('mousemove', move); canvas.addEventListener('mouseup', end); canvas.addEventListener('mouseleave', end);
  canvas.addEventListener('touchstart', start, { passive: false }); canvas.addEventListener('touchmove', move, { passive: false }); canvas.addEventListener('touchend', end); canvas.addEventListener('touchcancel', end);
}
function clearStoryCanvas() {
  const canvas = document.getElementById('storyCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  S.story.panel = null; debounceSave();
}

// === MIC / Speech-to-Text (same fix as prior weeks) ===
let recog = null, activeMicIdx = null;
function toggleMic(idx) {
  if (S.story.sentences[idx].locked) { toast('Unlock the sentence to use the mic', 'warning'); return; }
  if (!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) { toast('Speech-to-text not available — type instead', 'warning'); return; }
  if (recog && activeMicIdx === idx) { try { recog.stop(); } catch(e) {} return; }
  if (recog) try { recog.stop(); } catch(e) {}
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recog = new SR();
  recog.continuous = false; recog.interimResults = true; recog.lang = 'en-US';
  activeMicIdx = idx;
  const starting = S.story.sentences[idx].text || '';
  const needsSpace = starting && !/\s$/.test(starting);
  const prefix = starting + (needsSpace ? ' ' : '');
  const btn = document.getElementById('mic-' + idx);
  if (btn) { btn.classList.add('recording'); btn.textContent = '⏸'; }
  recog.onresult = function(e) {
    let interim = '', finalT = '';
    for (let i = 0; i < e.results.length; i++) { const piece = e.results[i][0].transcript; if (e.results[i].isFinal) finalT += piece; else interim += piece; }
    const transcript = (finalT + interim).trim();
    if (!transcript) return;
    const newText = prefix + transcript;
    S.story.sentences[idx].text = newText;
    if (S.story.sentences[idx].sourceCheck === 'match') S.story.sentences[idx].sourceCheck = null;
    S.story.sentences[idx].proofed = false; S.story.sentences[idx].proofIdx = 0;
    const ta = document.getElementById('story-text-' + idx);
    if (ta) ta.value = newText;
  };
  recog.onerror = function(e) {
    const err = (e && e.error) || 'unknown';
    stopMic();
    toast(err === 'not-allowed' ? 'Mic blocked — allow microphone in Safari settings, then try again' : 'Mic error: ' + err + ' — try typing', 'warning');
  };
  recog.onend = function() { stopMic(); renderStory(); debounceSave(); };
  try { recog.start(); toast('🎤 Listening... tap mic again to stop'); }
  catch(e) { stopMic(); toast('Mic could not start', 'warning'); }
}
function stopMic() {
  if (activeMicIdx !== null) { const btn = document.getElementById('mic-' + activeMicIdx); if (btn) { btn.classList.remove('recording'); btn.textContent = '🎤'; } }
  recog = null; activeMicIdx = null;
}

// ============================================================
//  TAB 4 — MY SUMMER PLAN (goals + goodbye)
// ============================================================
function renderPlan() {
  const el = document.getElementById('card-plan');
  const pl = S.plan;
  const hasReading = pl.readingGoals.length > 0 || pl.readingCustom.trim();
  const hasWriting = pl.writingGoals.length > 0 || pl.writingCustom.trim();

  const reviewBanner = pl.done ? '<div class="review-banner">✅ Summer plan set! Have an amazing summer, Marcello.</div>' : '';

  let html =
    '<div class="card">' +
    reviewBanner +
    '<h2>☀️ Your summer plan</h2>' +
    '<p class="directions">You have a whole summer ahead! Pick a reading goal and a writing goal. Your parents have a special <strong>Summer Adventure pack</strong> to help you keep your skills strong — here’s what’s inside.</p>' +
    '<div class="pack-preview">' +
    '<div class="pack-item"><div class="pi-emoji">📚</div><div class="pi-title">Reading log</div><div class="pi-desc">Color in a sun for every day you read 20 minutes.</div></div>' +
    '<div class="pack-item"><div class="pi-emoji">✍️</div><div class="pi-title">Story prompts</div><div class="pi-desc">Fun things to write about all summer long.</div></div>' +
    '<div class="pack-item"><div class="pi-emoji">🗣️</div><div class="pi-title">Dialogue helper</div><div class="pi-desc">Who’s talking? What did they say? Hug the words!</div></div>' +
    '<div class="pack-item"><div class="pi-emoji">👆</div><div class="pi-title">Word-by-word check</div><div class="pi-desc">Point to each word and read what’s really there.</div></div>' +
    '</div>' +
    '</div>';

  // Reading goal
  html += '<div class="card"><h2>📚 My summer reading goal</h2><div class="goal-chips">';
  READING_GOALS.forEach(function(g) {
    const on = pl.readingGoals.indexOf(g) !== -1;
    html += '<button class="goal-chip ' + (on ? 'active' : '') + '" onclick="toggleGoal(\'reading\',' + JSON.stringify(g).replace(/"/g,'&quot;') + ')">' + (on ? '✓ ' : '') + esc(g) + '</button>';
  });
  html += '</div><input class="label-input" style="max-width:none;margin-top:8px;" id="readingCustom" placeholder="…or write your own reading goal" oninput="onGoalCustom(\'reading\')" value="' + esc(pl.readingCustom) + '"></div>';

  // Writing goal
  html += '<div class="card"><h2>✍️ My summer writing goal</h2><div class="goal-chips">';
  WRITING_GOALS.forEach(function(g) {
    const on = pl.writingGoals.indexOf(g) !== -1;
    html += '<button class="goal-chip ' + (on ? 'active' : '') + '" onclick="toggleGoal(\'writing\',' + JSON.stringify(g).replace(/"/g,'&quot;') + ')">' + (on ? '✓ ' : '') + esc(g) + '</button>';
  });
  html += '</div><input class="label-input" style="max-width:none;margin-top:8px;" id="writingCustom" placeholder="…or write your own writing goal" oninput="onGoalCustom(\'writing\')" value="' + esc(pl.writingCustom) + '"></div>';

  // Stars + goodbye
  html += '<div class="card"><h2>⭐ One last thing</h2>' +
    '<p class="directions">Tap a star for everything you’re proud of today.</p>' +
    '<div class="stars-row">' +
    ['I looked back at my whole year','I read my summer words','I wrote a summer story','I used dialogue','I checked my words one by one'].map(function(label, i) {
      const on = pl.stars.indexOf(i) !== -1;
      return '<button class="star-btn ' + (on ? 'active' : '') + '" onclick="togglePlanStar(' + i + ')">' + (on ? '⭐ ' : '☆ ') + esc(label) + '</button>';
    }).join('') +
    '</div>' +
    '<div class="pep-banner">' +
    '<div style="font-size:2.6rem;margin-bottom:6px;">🎒☀️</div>' +
    '<h3>Have the BEST summer, Marcello!</h3>' +
    '<p>You worked so hard this year. Keep drawing, keep reading, keep telling your stories — and I’ll see you next year. I’m proud of you. 🌟</p>' +
    '</div>' +
    '<div class="btn-row"><button class="btn btn-orange" onclick="finishPlan()" ' + (hasReading && hasWriting ? '' : 'disabled') + '>' + (pl.done ? '✓ All done!' : 'Finish — my summer starts now! 🎉') + '</button></div>' +
    (hasReading && hasWriting ? '' : '<p style="text-align:center;font-size:0.83rem;color:var(--muted);font-style:italic;margin-top:6px;">Pick at least one reading goal and one writing goal.</p>') +
    '</div>';

  el.innerHTML = html;
}
function toggleGoal(kind, g) {
  const arr = kind === 'reading' ? S.plan.readingGoals : S.plan.writingGoals;
  const idx = arr.indexOf(g);
  if (idx !== -1) arr.splice(idx, 1); else arr.push(g);
  renderPlan(); debounceSave();
}
function onGoalCustom(kind) {
  const el = document.getElementById(kind + 'Custom');
  if (!el) return;
  if (kind === 'reading') S.plan.readingCustom = el.value; else S.plan.writingCustom = el.value;
  // re-evaluate finish button without full re-render (keep input focus)
  const hasReading = S.plan.readingGoals.length > 0 || S.plan.readingCustom.trim();
  const hasWriting = S.plan.writingGoals.length > 0 || S.plan.writingCustom.trim();
  const btn = document.querySelector('#card-plan .btn-orange');
  if (btn) btn.disabled = !(hasReading && hasWriting);
  debounceSave();
}
function togglePlanStar(i) {
  const idx = S.plan.stars.indexOf(i);
  if (idx !== -1) S.plan.stars.splice(idx, 1); else S.plan.stars.push(i);
  renderPlan(); debounceSave();
}
function finishPlan() {
  S.plan.done = true;
  S.timestamps.sessionEnd = new Date().toISOString();
  const readingGoal = S.plan.readingGoals.concat(S.plan.readingCustom.trim() ? [S.plan.readingCustom.trim()] : []).join('; ');
  const writingGoal = S.plan.writingGoals.concat(S.plan.writingCustom.trim() ? [S.plan.writingCustom.trim()] : []).join('; ');
  postToSheets('Activity Log', [SESSION_DATE, 'Marcello', 'Session Complete — Summer Send-Off', 'Wrap-up', 'Done', '', '',
    'Reading goal: ' + (readingGoal || '-') + ' | Writing goal: ' + (writingGoal || '-') + ' | Stars: ' + S.plan.stars.length]);
  toast('Have an amazing summer! 🎉🏖️');
  fireCelebration();
  setTimeout(fireCelebration, 600);
  saveImmediate();
  updateTabBadges();
}

// ============================================================
//  INIT
// ============================================================
async function init() {
  const cloudState = await loadStateFromCloud(CLOUD_STATE_KEY);
  if (cloudState && cloudState.timestamps) {
    S = Object.assign(freshState(), cloudState);
    backfill();
    toast('Loaded from cloud ☁️');
  } else if (loadFromLocalStorage()) {
    backfill();
    toast('Loaded local save');
  }
  if (S.plan && S.plan.done) switchTab('plan');
  else if (S.story && S.story.done) switchTab('plan');
  else if (S.reading && S.reading.done) switchTab('story');
  else if (isReviewDone()) switchTab('reading');
  else { renderReview(); updateTabBadges(); }
  setInterval(saveStateToCloud, 30000);
}
function backfill() {
  // tolerate older/partial blob shapes
  if (!S.story) S.story = freshState().story;
  S.story.sentences.forEach(function(s, i) {
    if (!s.mode) s.mode = (i === 1 ? 'dialogue' : 'narrative');
    if (s.mode === 'dialogue' && !s.dlg) s.dlg = { who: '', tag: 'said', words: '' };
    if (typeof s.proofIdx !== 'number') s.proofIdx = 0;
    if (typeof s.proofed !== 'boolean') s.proofed = false;
  });
  if (!S.review) S.review = freshState().review;
  if (!S.reading) S.reading = freshState().reading;
  if (!S.plan) S.plan = freshState().plan;
}
init();
</script>
